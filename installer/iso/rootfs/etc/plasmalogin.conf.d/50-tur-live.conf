#
# The live session of the TUR installer medium (ADR-0018, amendment of
# 13 November 2026): Plasma Login Manager signs the live user in at once,
# to Plasma on Wayland. This file exists only in the installer environment,
# never on an installed system. The keys are the ones tests/boot/splash.py
# proved for a throw-away boot, and the ones KDE neon's live images write.
[Autologin]
User=liveuser
Session=plasma.desktop
