#
# The installer's session directory on the medium (in memory). The engine,
# as root, writes its log here; the graphical installer, as the live user,
# writes its transcript to wizard/, which the engine copies to the installed
# disk with the rest. Present only on the installer medium.
d /run/tur-installer        0755 root     root     -
d /run/tur-installer/wizard 0755 liveuser liveuser -
