# SPDX-License-Identifier: LicenseRef-TUR-Noncommercial-1.0.0
[package]
name = "tur-pax"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-TUR-Noncommercial-1.0.0"
description = "TUR AI control layer: tool manifests, the policy engine, the audit record and the P@x orchestrator."
repository = "https://github.com/giorgiogiudice/TUR"
publish = false

# Each component is its own workspace with its own lockfile. See ADR-0005.
[workspace]

[lib]
name = "tur_pax"
path = "src/lib.rs"

[[bin]]
name = "tur-pax"
path = "src/main.rs"

[dependencies]
# Command-line parsing. Colour and suggestion features are left out to keep the
# dependency tree small.
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# Manifest, policy file and decision (de)serialisation.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tur-core = { path = "../../crates/tur-core" }
# The neutral conversation model, the provider adapters, spend accounting and
# the key type. The orchestrator talks to a model only through this crate.
tur-pax-providers = { path = "../tur-pax-providers" }
# Recall in its "notes, not instructions" frame, and the secret detectors the
# output filter reuses.
tur-pax-memory = { path = "../tur-pax-memory" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
