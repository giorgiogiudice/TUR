[package]
name = "tur-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-TUR-Noncommercial-1.0.0"
description = "TUR storage policy core: volume model, filesystem policy, mount decisions and runtime visibility mappings."
repository = "https://github.com/giorgiogiudice/TUR"
publish = false

# Each component is its own workspace with its own lockfile. See ADR-0005.
[workspace]

[dependencies]
tur-core = { path = "../../crates/tur-core" }
# Deserialises lsblk output and serialises the versioned JSON reports.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Command-line parsing. Colour and suggestion features are left out to keep the
# dependency tree small; the `env` feature is deliberately not enabled, so no
# argument can be supplied through the environment.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[dev-dependencies]
# P@x's loader of tool manifests and adapters, to check the ones this
# component ships (tests/agent_tools.rs). Only that test uses it; the
# program does not depend on the assistant.
tur-pax = { path = "../tur-pax" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
