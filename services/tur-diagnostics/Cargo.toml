# SPDX-License-Identifier: LicenseRef-TUR-Noncommercial-1.0.0
[package]
name = "tur-diagnostics"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-TUR-Noncommercial-1.0.0"
description = "tur-diag: local, redacted diagnostic bundles for TUR (specification sections 6.4, 6.5 and 29)."
repository = "https://github.com/giorgiogiudice/TUR"
publish = false

# Each component is its own workspace with its own lockfile. See ADR-0005.
[workspace]

[lib]
name = "tur_diag"
path = "src/lib.rs"

[[bin]]
name = "tur-diag"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
zstd = "0.13"
tur-core = { path = "../../crates/tur-core" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
