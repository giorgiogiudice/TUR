# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
[package]
name = "uos-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
description = "UOS AI control layer: tool manifests, the policy engine and the audit record."
repository = "https://github.com/giorgiogiudice/UOS"
publish = false

# Each component is its own workspace with its own lockfile. See ADR-0005.
[workspace]

[lib]
name = "uos_agent"
path = "src/lib.rs"
test = false

[[bin]]
name = "uos-agent"
path = "src/main.rs"
test = false

[[test]]
name = "cli"
path = "tests/cli.rs"
test = false

[dependencies]
# Command-line parsing. Colour and suggestion features are left out to keep the
# dependency tree small.
clap = { version = "4.5", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# Manifest, policy file and decision (de)serialisation.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uos-core = { path = "../../crates/uos-core" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
