# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
[package]
name = "uos-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
description = "UOS Universal Runtime Manager: inspects executables and packages, recommends a runtime, and runs Windows programs under Wine or Proton in a per-application prefix and sandbox."
repository = "https://github.com/giorgiogiudice/UOS"
publish = false

# Each component is its own workspace with its own lockfile. See ADR-0005.
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uos-core = { path = "../../crates/uos-core" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
