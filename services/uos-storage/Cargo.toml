# SPDX-License-Identifier: PolyForm-Noncommercial-1.0.0
[package]
name = "uos-storage"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
description = "UOS storage policy core: volume model, filesystem policy, mount decisions and runtime visibility mappings."
repository = "https://github.com/giorgiogiudice/UOS"
publish = false

# Each component is its own workspace with its own lockfile. See ADR-0005.
[workspace]

[dependencies]
uos-core = { path = "../../crates/uos-core" }
# Deserialises lsblk output and serialises the versioned JSON reports.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Command-line parsing. Colour and suggestion features are left out to keep the
# dependency tree small; the `env` feature is deliberately not enabled, so no
# argument can be supplied through the environment.
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
