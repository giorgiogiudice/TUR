# TUR speech catalogue entry. Format: schemas/speech-model.schema.json.
# How entries are written and sourced: services/tur-ai-local/speech/README.md.
#
# Sources read on 2026-11-16: the Hugging Face API tree of
# ggerganov/whisper.cpp at the pinned revision (file sizes and LFS SHA-256),
# the whisper.cpp README (memory) and the community benchmark the project
# points to (github.com/ggml-org/whisper.cpp/issues/89, encode times), and
# the Whisper paper (arXiv 2212.04356, Appendix D, Italian WER on FLEURS).

schema_version = 1
id = "whisper-tiny-q5-1"
kind = "recognition"
name = "Whisper tiny (5-bit)"
publisher = "OpenAI (weights), ggml conversion by the whisper.cpp project"
engine = "whisper.cpp"
repository = "https://huggingface.co/ggerganov/whisper.cpp"
revision = "5359861c739e955e79d9a303bcbc70fb988958b1"
parameters = "tiny, 39M, quantised to 5 bits (q5_1)"
# Whisper's multilingual models recognise about 99 languages, Italian
# included; "auto" lets the model find the language itself.
languages = ["mul"]
default_for = []
# Estimate: the whisper.cpp README's memory for the full-precision model,
# less the weights it no longer holds at 5 bits. Not measured by TUR.
memory_bytes = 250000000
# Estimate, not a TUR measurement: the encode time of one 30-second window
# with 8 threads on an i7-11800H, whisper.cpp of 2022, from issue #89. An
# utterance's wait is about one encode (pax-voice.md, section 3.3).
encode_ms_8_threads = 620
speed_basis = "whisper.cpp issue #89: i7-11800H, 8 threads, 2022 build, full-precision model of the same size; an estimate, not a TUR measurement"
# Whisper paper, Table 13, FLEURS, Italian, full-precision model.
wer_it_fleurs = 29.8
note = "The smallest model, for the weakest computers. Its Italian is poor (about 30 % of words wrong on FLEURS); English is usable."
credit = "none"
checked = "2026-11-16"

