evidence = "The card of nvidia/parakeet-tdt-0.6b-v3 declares CC-BY-4.0. The card of ggml-org/parakeet-GGUF declares MIT, but a conversion cannot change the licence of the weights, so TUR treats the file as CC BY 4.0. Attribution is a condition of sharing, not a restriction of use: TUR shows the credit wherever the model is offered or used."
