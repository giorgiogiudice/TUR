restrictions = "none"
evidence = "The model card header at the pinned revision declares apache-2.0, with license_link https://ai.google.dev/gemma/docs/gemma_4_license; that address redirects to https://ai.google.dev/gemma/apache_2, which is the Apache License 2.0 text, read on 2026-11-13. Google's Gemma Terms of Use (https://ai.google.dev/gemma/terms, last modified 2026-04-01) say that they apply to the Gemma models listed in their appendix and: \"For Gemma 4 terms, see the Gemma 4 license.\" The Gemma Prohibited Use Policy belongs to those terms, so it does not apply to Gemma 4. The repository holds no licence file and is not gated."
