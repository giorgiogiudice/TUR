# TUR local model catalogue entry. Format: schemas/local-model.schema.json.
# How entries are written and sourced: services/tur-ai-local/catalogue/README.md.
#
# Sources read on 2026-11-13: the Hugging Face API for google/gemma-4-E2B-it-qat-q4_0-gguf
# (revision, file list, sizes and LFS SHA-256 digests; the pinned resolve
# URLs answered with the same size and digest), its README.md at the pinned
# revision, the base model's config.json
# (35 layers, 7 of them full attention, 1 KV head, global head size 512,
# 512-token sliding window),
# and the licence pages named in [licence].

schema_version = 1
id = "gemma-4-e2b"
name = "Gemma 4 E2B"
publisher = "Google DeepMind"
repository = "https://huggingface.co/google/gemma-4-E2B-it-qat-q4_0-gguf"
revision = "675cff42a74c774d6cb76f76d8eacb49b48c9b93"
format = "gguf"
# Quantisation-aware training (QAT) checkpoint, published as Q4_0 by Google.
quantisation = "Q4_0 (QAT)"
parameters = "2.3B effective, 5.1B with embeddings"
# The model card: "Context Length | 128K tokens".
context_length = 131072
# Estimate, not measured: the two files; the 16-bit context cache at 8192
# tokens of the 7 full-attention layers (1 KV head x 512 x 2 x 2 bytes =
# 2,048 bytes each, 14,336 bytes per token; the 28 sliding-window layers
# keep only their 512-token window, 15 MB); 512 MiB for the engine's
# working memory and 300 MB for encoding one image; all of it times 1.4,
# the ratio llama.cpp's own build showed over the same sum for Qwen3 4B in
# CI run 43277339192 (its processor kernels keep a repacked copy of the
# weights), rounded up. To be replaced by a measurement.
# active_weight_bytes, the bytes read for each generated token: the file
# times 2.3/5.1, because the per-layer embeddings are looked up, not
# multiplied (the card).
memory_bytes = 7410000000
memory_context = 8192
kv_bytes_per_token = 14336
active_weight_bytes = 1510000000
capabilities = ["chat", "tools", "vision"]
# The model card: "configurable thinking modes"; llama.cpp's chat template
# switches it with enable_thinking.
thinking = "hybrid"
languages = ["mul"]
languages_note = "The publisher states multilingual support in over 140 languages."
good_for = [
  "Conversation, writing and summarising on a computer with 16 GB of memory, privately.",
  "Tool calls for an assistant that acts.",
  "Questions about images and screenshots.",
]
checked = "2026-11-13"

