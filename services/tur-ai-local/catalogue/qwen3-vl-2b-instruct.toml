# TUR local model catalogue entry. Format: schemas/local-model.schema.json.
# How entries are written and sourced: services/tur-ai-local/catalogue/README.md.
#
# Sources read on 2026-11-12: the Hugging Face API for
# Qwen/Qwen3-VL-2B-Instruct-GGUF (revision, file list, sizes and LFS SHA-256
# digests), its README.md at the pinned revision, the base model's
# config.json, and the GitHub API for QwenLM/Qwen3-VL.

schema_version = 1
id = "qwen3-vl-2b-instruct"
name = "Qwen3-VL 2B Instruct"
publisher = "Qwen (Alibaba Cloud)"
repository = "https://huggingface.co/Qwen/Qwen3-VL-2B-Instruct-GGUF"
revision = "52d6c8ffea26cc873ac5ad116f8631268d7eb503"
format = "gguf"
quantisation = "Q4_K_M"
parameters = "2B"
# The model card: "Native 256K context, expandable to 1M".
context_length = 262144
# Estimate: the model and projector files, the 16-bit context cache at 8192
# tokens (28 layers x 8 KV heads x 128 x 2 x 2 bytes = 114,688 bytes per
# token), 512 MiB for the engine's working memory and about 300 MB for
# encoding one image, was 3.35 GB. Raised to 3.65 GB: llama.cpp's own
# build peaked at 3.28 GB in CI run 43277339192 (Fedora's at 2.68 GB).
# 10 % above the higher peak.
memory_bytes = 3650000000
memory_context = 8192
kv_bytes_per_token = 114688
capabilities = ["chat", "tools", "vision", "locate"]
# Located 64 % of the controls of plain dialogs at their own size and 74 %
# enlarged 1.5 times (CI run 43545838974). Its peak memory while locating at
# that size was 4.42 GB, above memory_bytes: the larger pictures cost more
# to encode. Qwen3-VL 4B Instruct is the model P@x locates with.
locate_scale = 1.5
thinking = "none"
languages = ["mul"]
languages_note = "The publisher states text recognition (OCR) in 32 languages; the languages of conversation are not listed."
good_for = [
  "Questions about images and screenshots.",
  "Reading text in images.",
]
checked = "2026-11-12"

