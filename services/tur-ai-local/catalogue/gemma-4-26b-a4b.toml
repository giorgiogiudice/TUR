# Sources read on 2026-11-13: the Hugging Face API for google/gemma-4-26B-A4B-it-qat-q4_0-gguf
# (revision, file list, sizes and LFS SHA-256 digests; the pinned resolve
# URLs answered with the same size and digest), its README.md at the pinned
# revision, the base model's config.json
# (30 layers: 5 full-attention layers with 2 KV heads of 512, 25
# sliding-window layers with 8 KV heads of 256 and a 1024-token window),
# and the licence pages named in [licence].

schema_version = 1
id = "gemma-4-26b-a4b"
name = "Gemma 4 26B A4B"
publisher = "Google DeepMind"
repository = "https://huggingface.co/google/gemma-4-26B-A4B-it-qat-q4_0-gguf"
revision = "d1c082be9cf3c8a514acf63b8761f4b41935842e"
format = "gguf"
# Quantisation-aware training (QAT) checkpoint, published as Q4_0 by Google.
quantisation = "Q4_0 (QAT)"
parameters = "25.2B, 3.8B active (mixture of experts)"
# The model card: "Context Length | 256K tokens".
context_length = 262144
# Estimate, not measured: the two files; the 16-bit context cache at 8192
# tokens of the 5 full-attention layers (2 KV heads x 512 x 2 x 2 bytes =
# 4,096 bytes each, 20,480 bytes per token) and the fixed cache of the 25
# sliding-window layers (8 KV heads x 256 x 2 x 2 bytes x 1024 tokens,
# 210 MB); 512 MiB for the engine and 300 MB for one image; all of it
# times 1.4, as for the other entries, rounded up. To be replaced by a
# measurement.
# active_weight_bytes: the file times 3.8/25.2, the active share of a
# mixture-of-experts model (the card: 3.8B active).
memory_bytes = 23590000000
memory_context = 8192
kv_bytes_per_token = 20480
active_weight_bytes = 2180000000
capabilities = ["chat", "tools", "vision"]
# The model card: "configurable thinking modes"; llama.cpp's chat template
# switches it with enable_thinking.
thinking = "hybrid"
languages = ["mul"]
languages_note = "The publisher states multilingual support in over 140 languages."
good_for = [
  "A stronger assistant for a computer with 32 GB of memory, or a graphics card with 24 GB of its own memory.",
  "Tool calls, reasoning and help with code.",
  "Questions about images and screenshots.",
]
checked = "2026-11-13"

