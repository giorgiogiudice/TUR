# TUR local model catalogue entry. Format: schemas/local-model.schema.json.
# How entries are written and sourced: services/tur-ai-local/catalogue/README.md.
#
# Sources read on 2026-11-13: the Hugging Face API for google/gemma-4-E4B-it-qat-q4_0-gguf
# (revision, file list, sizes and LFS SHA-256 digests; the pinned resolve
# URLs answered with the same size and digest), its README.md at the pinned
# revision, the base model's config.json
# (42 layers, 7 of them full attention, 2 KV heads, global head size 512,
# 512-token sliding window),
# and the licence pages named in [licence].

schema_version = 1
id = "gemma-4-e4b"
name = "Gemma 4 E4B"
publisher = "Google DeepMind"
repository = "https://huggingface.co/google/gemma-4-E4B-it-qat-q4_0-gguf"
revision = "4b4a2c1d584be7264f87aac328a1bc739ce81b6c"
format = "gguf"
# Quantisation-aware training (QAT) checkpoint, published as Q4_0 by Google.
quantisation = "Q4_0 (QAT)"
parameters = "4.5B effective, 8B with embeddings"
# The model card: "Context Length | 128K tokens".
context_length = 131072
# Estimate, not measured: the two files; the 16-bit context cache at 8192
# tokens of the 7 full-attention layers (2 KV heads x 512 x 2 x 2 bytes =
# 4,096 bytes each, 28,672 bytes per token; the 35 sliding-window layers
# keep only their 512-token window, 37 MB); 512 MiB for the engine and
# 300 MB for one image; all of it times 1.4, the ratio llama.cpp's own
# build showed for Qwen3 4B in CI run 43277339192, rounded up. To be
# replaced by a measurement.
# active_weight_bytes: the file times 4.5/8 (the card: 4.5B effective of
# 8B with the per-layer embeddings).
memory_bytes = 10110000000
memory_context = 8192
kv_bytes_per_token = 28672
active_weight_bytes = 2900000000
capabilities = ["chat", "tools", "vision"]
# The model card: "configurable thinking modes"; llama.cpp's chat template
# switches it with enable_thinking.
thinking = "hybrid"
languages = ["mul"]
languages_note = "The publisher states multilingual support in over 140 languages."
good_for = [
  "Writing, summarising, translating and help with code on a computer with 16 GB of memory or more.",
  "Tool calls for an assistant that acts.",
  "Questions about images and screenshots.",
]
checked = "2026-11-13"

