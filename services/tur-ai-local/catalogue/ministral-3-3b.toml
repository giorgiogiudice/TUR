schema_version = 1
id = "ministral-3-3b"
name = "Ministral 3 3B Instruct"
publisher = "Mistral AI"
repository = "https://huggingface.co/mistralai/Ministral-3-3B-Instruct-2512-GGUF"
revision = "eb599d408350ea2bb60452cb86be7c7b2fc28227"
format = "gguf"
quantisation = "Q4_K_M"
parameters = "3.4B, with a 0.4B vision encoder"
# The model card: "Supports a 256k context window"; config.json:
# max_position_embeddings 262144.
context_length = 262144
# Estimate, not measured: the model file and the BF16 projector the
# publisher ships; the 16-bit context cache at 8192 tokens (26 layers x 8
# KV heads x 128 x 2 x 2 bytes = 106,496 bytes per token); 512 MiB for the
# engine's working memory and 300 MB for one image; all of it times 1.4,
# the ratio llama.cpp's own build showed for Qwen3 4B in CI run
# 43277339192, rounded up. The local-ai workflow measures it.
memory_bytes = 6580000000
memory_context = 8192
kv_bytes_per_token = 106496
capabilities = ["chat", "tools", "vision"]
# An instruct model; the publisher's reasoning variant is a separate model.
thinking = "none"
languages = ["en", "fr", "es", "de", "it", "pt", "nl", "zh", "ja", "ko", "ar"]
languages_note = "The publisher states support for dozens of languages and lists these eleven."
good_for = [
  "A small assistant that acts, on a computer with 8 to 16 GB of memory.",
  "Tool calls and JSON output (the publisher: native function calling).",
  "Questions about images and screenshots.",
]
checked = "2026-11-13"

