# TUR local model catalogue entry. Format: schemas/local-model.schema.json.
# How entries are written and sourced: services/tur-ai-local/catalogue/README.md.
#
# Sources read on 2026-11-12: the Hugging Face API for
# ibm-granite/granite-4.0-1b-GGUF (revision, file list, sizes and LFS SHA-256
# digests), its README.md at the pinned revision, the base model's card
# (ibm-granite/granite-4.0-1b) and its config.json, and the GitHub API for
# ibm-granite/granite-4.0-language-models.
#
# The GGUF card warns that "this model often uses the full numerical range of
# a 32-bit float", that variants with smaller numerical ranges may run into
# precision errors and that the F16 variant fails on many hardware
# combinations. Q4_K_M is entered; whether it answers sensibly is what the
# local-ai workflow measures.

schema_version = 1
id = "granite-4.0-1b"
name = "Granite 4.0 1B"
publisher = "IBM"
repository = "https://huggingface.co/ibm-granite/granite-4.0-1b-GGUF"
revision = "b27c2fe3f211b7f44e80fa620177aea371099aaa"
format = "gguf"
quantisation = "Q4_K_M"
parameters = "1B"
# The base model card's table gives a 128K context for the Nano models.
context_length = 131072
# Estimate: the file, the 16-bit context cache at 8192 tokens
# (40 layers x 4 KV heads x 128 x 2 x 2 bytes = 81,920 bytes per token)
# and 512 MiB for the engine's working memory, was 2.25 GB. Raised to
# 2.75 GB: llama.cpp's own build peaked at 2.46 GB in CI run 43277339192;
# Fedora's at 1.84 GB. 10 % above the higher peak.
memory_bytes = 2750000000
memory_context = 8192
kv_bytes_per_token = 81920
capabilities = ["chat", "tools"]
thinking = "none"
# The base model card: "English, German, Spanish, French, Japanese,
# Portuguese, Arabic, Czech, Italian, Korean, Dutch, and Chinese."
languages = ["en", "de", "es", "fr", "ja", "pt", "ar", "cs", "it", "ko", "nl", "zh"]
good_for = [
  "Tool calls: the publisher describes enhanced tool calling.",
  "Short answers and extraction on modest computers.",
]
checked = "2026-11-12"

