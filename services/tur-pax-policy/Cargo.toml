# SPDX-License-Identifier: LicenseRef-TUR-Noncommercial-1.0.0
[package]
name = "tur-pax-policy"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-TUR-Noncommercial-1.0.0"
description = "The policy store of P@x: the person's policy and standing approvals, in a place P@x's own process cannot write, changed only through polkit."
repository = "https://github.com/giorgiogiudice/TUR"
publish = false

# Each component is its own workspace with its own lockfile. See ADR-0005.
[workspace]

[lib]
name = "tur_pax_policy"
path = "src/lib.rs"

[[bin]]
name = "tur-pax-policy"
path = "src/main.rs"

# Nothing else: the program runs as root when it writes, so it links only
# what it needs to read and write two JSON documents.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
