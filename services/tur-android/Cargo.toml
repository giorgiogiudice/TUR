# SPDX-License-Identifier: LicenseRef-TUR-Noncommercial-1.0.0
[package]
name = "tur-android"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-TUR-Noncommercial-1.0.0"
description = "TUR Android runtime, first slice: switches Waydroid on and off with the person's consent, and installs, lists, starts and removes Android applications."
repository = "https://github.com/giorgiogiudice/TUR"
publish = false

# Each component is its own workspace with its own lockfile. See ADR-0005.
[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tur-core = { path = "../../crates/tur-core" }
# The runtime manager's package inspector (what kind of file, which native
# code) and its SHA-256. A library dependency only; the program does not run
# tur-runtime.
tur-runtime = { path = "../tur-runtime" }

[dev-dependencies]
# P@x's loader of tool manifests and adapters, to check the ones this
# component ships (tests/agent_tools.rs).
tur-pax = { path = "../tur-pax" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
