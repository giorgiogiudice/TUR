#
# The two typefaces of TUR's desktop that the base image does not carry
# (docs/architecture/desktop-experience.md, 5.3): Inter, the interface face
# of TUR's programs outside the session's theme (P@x's overlay; later setup
# and the installer), and JetBrains Mono, for commands, codes and technical
# detail in every TUR program. Fedora's packages, pinned by the SHA-256 of
# the signed package as published in the Fedora 45 release tree, which does
# not change after the release; the same versions the desktop builder has
# (desktop/ci/builder.packages), so that the programs look as their
# reference images. image/desktop/build.sh downloads each from the first
# address that answers and refuses one whose checksum differs; the final
# stage of image/Containerfile installs them with rpm.
#
# file	sha256	licence	path under the Fedora 45 release tree
