#
# State that must survive a rollback lives under /var, which every
# deployment shares, never under /etc (design section 5.2).
d /var/lib/tur 0755 root root -
d /var/lib/tur/boot-health 0755 root root -
d /var/lib/tur/boot-health/evidence 0755 root root -
