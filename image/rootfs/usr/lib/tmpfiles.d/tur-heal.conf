#
# Self-healing (docs/architecture/self-healing.md, section 6). The record of
# problems and repairs holds nothing personal and may be read by anyone (P@x's
# read-only sandbox shows /var/log). Copies of replaced files are root's only.
d /var/log/tur 0755 root root -
d /var/log/tur/heal 0755 root root -
# /var/lib/tur itself is declared in tur-boot-health.conf, read first.
d /var/lib/tur/heal 0700 root root -
