#
# boot-complete.target is reached only when the boot health gate has passed
# (systemd's automatic boot assessment, with TUR's counter in GRUB's
# environment block in place of systemd-boot's; ADR-0014).

[Unit]
Requires=tur-boot-health.service
After=tur-boot-health.service
