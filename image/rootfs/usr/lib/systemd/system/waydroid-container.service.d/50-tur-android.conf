#
# Android is off until the person switches it on (ADR-0006;
# android-runtime.md, section 10.2: "service masked until opt-in").
# Waydroid's container service runs as root and is started on demand through
# D-Bus by anyone on the machine; this condition keeps it from starting at
# all, by D-Bus or by hand, until `tur-android enable` has created the flag.
# `tur-android disable` removes it again. A mask would do the same, but it
# lives in /etc and would survive in the person's /etc across images; a
# condition in the image does not.
[Unit]
ConditionPathExists=/var/lib/tur/android/enabled
