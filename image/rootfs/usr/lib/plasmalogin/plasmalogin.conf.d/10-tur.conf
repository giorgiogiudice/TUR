#
# The login screen's wallpaper is TUR's (desktop-experience.md, 6.3). The
# image build also points the base's defaults.conf, beside this directory, at
# the same picture.
[Greeter]
WallpaperPlugin=org.kde.image

[Greeter][Wallpaper][org.kde.image][General]
Image=file:///usr/share/wallpapers/Tur/
PreviewImage=file:///usr/share/wallpapers/Tur/
