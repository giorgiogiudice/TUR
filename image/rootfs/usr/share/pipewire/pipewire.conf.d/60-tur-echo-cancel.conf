#
# PipeWire's echo canceller, for P@x's voice (docs/architecture/pax-voice.md,
# section 4.2; the owner's decision of 16 November 2026). Configuration
# only: the module and its WebRTC canceller are part of Fedora's PipeWire
# (libpipewire-module-echo-cancel, aec/libspa-aec-webrtc); no package is
# added.
#
# It makes two extra devices and changes no default: an echo-cancelled
# microphone ("tur-echo-cancel-source") and a speaker whose sound it removes
# from that microphone ("tur-echo-cancel-sink"). P@x captures from the first
# and plays into the second when both are there, so that in a live
# conversation the person's voice can interrupt P@x without P@x hearing
# itself. Other programs keep the devices the person chose. The capture and
# playback streams are passive: the microphone is not opened, and nothing
# is processed, unless a program uses one of the two devices.
#
# Not yet verified on the TUR image: that Fedora 45's PipeWire ships the
# WebRTC canceller this names, and the delay it adds.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            monitor.mode = false
            capture.props = {
                node.name = "tur-echo-cancel-capture"
                node.passive = true
            }
            source.props = {
                node.name = "tur-echo-cancel-source"
                node.description = "Microphone with echo cancelled (P@x)"
            }
            sink.props = {
                node.name = "tur-echo-cancel-sink"
                node.description = "Speaker with echo cancelled (P@x)"
            }
            playback.props = {
                node.name = "tur-echo-cancel-playback"
                node.passive = true
            }
        }
    }
]
