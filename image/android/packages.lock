waydroid-selinux-1.6.3-2.fc45	GPL-3.0-only
# Waydroid shares the clipboard only when it can import pyclip
# (tools/services/clipboard_manager.py); Fedora's package stopped recommending
# it in 1.6.0-2. pyclip reaches a Wayland clipboard through wl-clipboard's
# wl-copy and wl-paste. The owner's decision of 15 November 2026.
python3-pyclip-0.7.0-17.fc45	Apache-2.0
wl-clipboard-2.3.0-2.fc45	GPL-3.0-or-later
