<!-- Sketch for docs/architecture/desktop-experience.md, sections 9.3 to 9.5.
     Not final artwork. Drawn by hand as plain SVG; no third-party material. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470"
     font-family="Inter, 'Noto Sans', sans-serif" font-size="13">
  <title>P@x's pointer, activity indicator and highlight</title>
  <rect width="860" height="470" fill="#0B0F17"/>

  <!-- Column headings -->
  <g fill="#A9B4C6" font-size="12">
    <text x="40" y="34">THE USER'S CURSOR</text>
    <text x="200" y="34">P@X'S POINTER</text>
    <text x="400" y="34">A CLICK BY P@X</text>
    <text x="580" y="34">ON A LIGHT BACKGROUND</text>
  </g>

  <!-- The user's cursor: the system theme's arrow, unchanged -->
  <g transform="translate(60 60) scale(2)">
    <polygon points="0,0 0,22 6,17 10,26 13,24.5 9,16 16,16"
             fill="#FFFFFF" stroke="#0B1220" stroke-width="1" stroke-linejoin="round"/>
  </g>
  <text x="40" y="150" fill="#EEF1F6">An arrow, from the cursor</text>
  <text x="40" y="168" fill="#EEF1F6">theme. TUR does not change it.</text>

  <!-- P@x's pointer: a flame-shaped teardrop; the tip (0,0) is the hot spot -->
  <defs>
    <path id="flame" d="M0,0 L24.86,11.03 A12,12 0 1,1 8.62,25.80 Z"/>
  </defs>
  <g transform="translate(220 58) scale(2.4)">
    <use href="#flame" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round"/>
    <use href="#flame" fill="#E8B44C" stroke="#0B1220" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="20" cy="22" r="4.5" fill="#FDF682"/>
    <rect x="35" y="27" width="30" height="14" rx="7" fill="#E8B44C" stroke="#0B1220" stroke-width="1"/>
    <text x="50" y="37.5" font-size="8.5" font-weight="600" fill="#1A1204" text-anchor="middle">P@x</text>
  </g>
  <text x="200" y="176" fill="#EEF1F6">Gold flame, dark outline, white</text>
  <text x="200" y="194" fill="#EEF1F6">hairline, and a tag. 1.5 times</text>
  <text x="200" y="212" fill="#EEF1F6">the size of the user's cursor.</text>

  <!-- A click: rings expanding from the tip -->
  <g transform="translate(440 70)">
    <circle r="12" fill="none" stroke="#E8B44C" stroke-width="2.5"/>
    <circle r="22" fill="none" stroke="#E8B44C" stroke-width="2" opacity="0.55"/>
    <circle r="32" fill="none" stroke="#E8B44C" stroke-width="1.5" opacity="0.25"/>
    <g transform="scale(2.4)">
      <use href="#flame" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round"/>
      <use href="#flame" fill="#E8B44C" stroke="#0B1220" stroke-width="1.5" stroke-linejoin="round"/>
      <circle cx="20" cy="22" r="4.5" fill="#FDF682"/>
    </g>
  </g>
  <text x="400" y="176" fill="#EEF1F6">A ring grows from the tip</text>
  <text x="400" y="194" fill="#EEF1F6">and fades.</text>

  <!-- The same pointer over light content -->
  <rect x="580" y="48" width="240" height="110" rx="6" fill="#F3F5F9"/>
  <g transform="translate(620 62) scale(2.4)">
    <use href="#flame" fill="none" stroke="#FFFFFF" stroke-width="3.6" stroke-linejoin="round"/>
    <use href="#flame" fill="#E8B44C" stroke="#0B1220" stroke-width="1.5" stroke-linejoin="round"/>
    <circle cx="20" cy="22" r="4.5" fill="#FDF682"/>
    <rect x="35" y="27" width="30" height="14" rx="7" fill="#E8B44C" stroke="#0B1220" stroke-width="1"/>
    <text x="50" y="37.5" font-size="8.5" font-weight="600" fill="#1A1204" text-anchor="middle">P@x</text>
  </g>
  <text x="580" y="176" fill="#EEF1F6">The same colours on any</text>
  <text x="580" y="194" fill="#EEF1F6">background.</text>

  <!-- Activity indicator: the pill, by state -->
  <text x="40" y="262" fill="#A9B4C6" font-size="12">THE PILL, BY STATE</text>

  <g transform="translate(40 278)">
    <rect width="250" height="36" rx="18" fill="#0B1220" stroke="#E8B44C" stroke-width="2"/>
    <ellipse cx="24" cy="18" rx="9" ry="5.5" fill="none" stroke="#E8B44C" stroke-width="1.8"/>
    <circle cx="24" cy="18" r="2.6" fill="#E8B44C"/>
    <text x="42" y="22.5" fill="#E8B44C">P@x can see this window</text>
    <text x="0" y="56" fill="#A9B4C6" font-size="12">Observing: dark, gold outline, solid frame</text>
  </g>

  <g transform="translate(310 278)">
    <rect width="290" height="36" rx="18" fill="#E8B44C" stroke="#0B1220" stroke-width="1.5"/>
    <g transform="translate(15 8) scale(0.8)">
      <use href="#flame" fill="#1A1204"/>
    </g>
    <text x="42" y="22.5" fill="#1A1204" font-weight="600">P@x is controlling · Stop: Meta+Esc</text>
    <text x="0" y="56" fill="#A9B4C6" font-size="12">Acting: solid gold, dark text, thicker frame</text>
  </g>

  <g transform="translate(620 278)">
    <rect width="200" height="36" rx="18" fill="#0B1220" stroke="#A9B4C6" stroke-width="2" stroke-dasharray="6 4"/>
    <rect x="18" y="11" width="4" height="14" fill="#A9B4C6"/>
    <rect x="26" y="11" width="4" height="14" fill="#A9B4C6"/>
    <text x="42" y="22.5" fill="#EEF1F6">P@x is paused</text>
    <text x="0" y="56" fill="#A9B4C6" font-size="12">Paused: grey, dashed</text>
  </g>

  <!-- Highlight around one row -->
  <text x="40" y="382" fill="#A9B4C6" font-size="12">THE HIGHLIGHT</text>
  <g transform="translate(40 396)">
    <rect width="520" height="54" rx="6" fill="#131A27"/>
    <text x="18" y="33" fill="#EEF1F6">Switching times</text>
    <rect x="300" y="14" width="200" height="26" rx="6" fill="#1B2434" stroke="#6B7A95"/>
    <text x="312" y="32" fill="#EEF1F6">Always off</text>
    <rect x="-5" y="-5" width="530" height="64" rx="9" fill="none" stroke="#0B1220" stroke-width="5"/>
    <rect x="-5" y="-5" width="530" height="64" rx="9" fill="none" stroke="#E8B44C" stroke-width="3"/>
  </g>
  <g transform="translate(590 400)">
    <rect width="230" height="50" rx="14" fill="#1B2434" stroke="#E8B44C" stroke-width="1.5"/>
    <text x="14" y="21" fill="#A9B4C6" font-size="12">Step 2 of 3</text>
    <text x="14" y="39" fill="#EEF1F6">Open this list.</text>
  </g>
</svg>
