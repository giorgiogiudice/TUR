# SPDX-License-Identifier: LicenseRef-TUR-Noncommercial-1.0.0
#
# Local AI (ADR-0021) against a real engine and real models, on the
# runner's processor. See docs/architecture/local-ai.md and
# docs/reports/local-ai-1.md.
#
# fedora:  Fedora 45's own llama-cpp package (what the image would install)
#          in a Fedora 45 container, driven by tur-ai-local: the proof with
#          the smallest model (download, refusal of changed files, serving
#          on the loopback interface only, chat, streaming, a tool call,
#          idle stop), then every catalogue model measured.
# compare: the engine comparison on the same runner: llama.cpp's own
#          release build of the same version, and Fedora 45's Ollama.
# pax:     P@x itself against the local server: tur-pax run through the
#          local preset (docs/architecture/pax-providers.md, 14.8), the key
#          read from tur-ai-local's key file, every component's tools and
#          the read-only command tool in the real sandbox, Qwen3 4B on
#          llama.cpp's own build (tests/pax/local_model.py).
#
# Checks about TUR fail the workflow. What a model answers is measured and
# recorded, and never fails it. Nothing runs on a graphics processor: the
# runner has none.
name: local-ai

on:
  pull_request:
    paths:
      - "services/tur-ai-local/**"
      # The local preset, and the script that runs P@x through it.
      - "services/tur-pax/data/models.json"
      - "tests/pax/local_model.py"
      - "schemas/local-model.schema.json"
      - "schemas/ai-local-report.schema.json"
      - "crates/tur-core/**"
      - "rust-toolchain.toml"
      - ".github/workflows/local-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-ai-${{ github.ref }}
  cancel-in-progress: true

env:
  # quay.io/fedora/fedora:45, read on 2026-11-13. The tag is a manifest list.
  # The digest read on 2026-11-12 (sha256:fa773d10…) was gone from quay.io a
  # day later ("manifest unknown"), as image/README.md describes for the
  # base; this container image has no mirror (docs/reports/TUR-010.md).
  FEDORA_IMAGE: quay.io/fedora/fedora:45@sha256:e15959f36d52307f176f8c068009f6f1451c3b238b37a1f03e56dbfa4526e8b1
  # The engine as Fedora 45 packages it (f45 and f45-updates, 2026-11-12).
  LLAMA_CPP_RPM: llama-cpp-b9840-2.fc45
  OLLAMA_RPM: ollama-base-0.24.0-4.fc45
  # llama.cpp's own release of the same version, CPU build for x86-64
  # (GGML_BACKEND_DL, GGML_CPU_ALL_VARIANTS), and its SHA-256 as GitHub
  # reports it for the release asset.
  UPSTREAM_URL: https://github.com/ggml-org/llama.cpp/releases/download/b9840/llama-b9840-bin-ubuntu-x64.tar.gz
  UPSTREAM_SHA256: 7a8a02089076eb6bd86e6a5d23ea99b91ce0d13f8d43b01fa3ad5aa4e02e7e92
  # The models measured one by one: the first list (local-ai-1), and in the
  # comparison job also Gemma 4 E2B, the smallest Gemma 4 the catalogue
  # offers, to show that the engine version runs it. The larger models of
  # the second list do not fit the runner's 16 GB or take too long on its
  # processor; their entries say they are estimates.
  FIRST_LIST: qwen3-0.6b,granite-4.0-1b,qwen3-vl-2b-instruct,qwen3-4b,qwen3-embedding-0.6b
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  fedora:
    name: Fedora 45 llama-server, driven by tur-ai-local
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Room on the disk
        run: |
          WORK="$RUNNER_TEMP/local-ai"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
          mkdir -p "$WORK/bin" "$WORK/data" "$WORK/run" "$WORK/evidence"
          python3 -m py_compile services/tur-ai-local/ci/local_ai_ci.py

      - name: Toolchain
        working-directory: services/tur-ai-local
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version; cargo --version

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            services/tur-ai-local/target
          key: local-ai-release-${{ hashFiles('rust-toolchain.toml', 'services/tur-ai-local/Cargo.toml', 'services/tur-ai-local/Cargo.lock') }}
          restore-keys: local-ai-release-

      - name: Build tur-ai-local
        working-directory: services/tur-ai-local
        run: |
          if [ -f Cargo.lock ]; then cargo build --release --locked; else cargo build --release; fi
          install -m 0755 target/release/tur-ai-local "$WORK/bin/tur-ai-local"

      - name: The runner's hardware, with Vulkan's software device
        # The runner has no graphics processor. Mesa's llvmpipe gives
        # vulkaninfo one device of type CPU, which tur-ai-local must not
        # count as usable.
        run: |
          sudo apt-get install -y --no-install-recommends vulkan-tools mesa-vulkan-drivers >/dev/null
          vulkaninfo --summary > "$WORK/evidence/vulkaninfo-summary.txt" 2>/dev/null || true
          "$WORK/bin/tur-ai-local" hardware --json --engine /nonexistent/llama-server > "$WORK/evidence/hardware-runner.json"
          python3 - "$WORK/evidence/hardware-runner.json" "$WORK/evidence/vulkaninfo-summary.txt" <<'PY'
          import json, sys
          report = json.load(open(sys.argv[1]))
          hardware = report["hardware"]
          print(json.dumps(hardware["cpu"], indent=1), json.dumps(hardware["memory"]), json.dumps(hardware["vulkan"], indent=1), sep="\n")
          devices = hardware["vulkan"]["devices"]
          summary = open(sys.argv[2]).read()
          if "GPU0:" in summary:
              assert hardware["vulkan"]["status"] == "listed", hardware["vulkan"]
              assert all(d["device_type"] == "cpu" and not d["usable"] for d in devices), devices
              assert hardware["usable_open_backend"] is False
              print("vulkaninfo read: only a software device, not usable")
          else:
              print("vulkaninfo printed no device here; status", hardware["vulkan"]["status"])
          PY

      - name: The smallest model, from the cache when it is there
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/local-ai/data/tur/models/qwen3-0.6b
          key: local-ai-model-qwen3-0.6b-9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031

      - name: A Fedora 45 container with Fedora's llama-cpp
        run: |
          docker run -d --name fedora --network host \
            -v "$GITHUB_WORKSPACE:/w:ro" -v "$WORK:$WORK" "$FEDORA_IMAGE" sleep infinity
          docker exec fedora bash -c 'rpm -qa --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\t%{SIZE}\n" | sort > /tmp/before'
          docker exec fedora dnf -y --setopt=install_weak_deps=False install \
            "$LLAMA_CPP_RPM" python3 util-linux procps-ng 2>&1 | tail -n 40 | tee "$WORK/evidence/dnf-llama-cpp.txt"
          docker exec fedora bash -c '
            rpm -qa --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\t%{SIZE}\n" | sort > /tmp/after
            comm -13 /tmp/before /tmp/after > /tmp/added
            echo "packages added: $(wc -l < /tmp/added)"
            awk -F"\t" "{s+=\$2} END {printf \"installed size of the added packages: %.0f MB\n\", s/1e6}" /tmp/added
            sort -k2 -n -r /tmp/added | head -n 15
            rpm -q llama-cpp; rpm -q --qf "%{LICENSE}\n" llama-cpp
            ls -la /usr/lib64/libggml* /usr/bin/llama-server
            llama-server --version 2>&1 | tail -n 3 || true
            cat /etc/os-release | head -n 3' | tee "$WORK/evidence/fedora-llama-cpp.txt"
          docker exec fedora bash -c 'rpm -q --qf "%{NAME}\t%{VERSION}-%{RELEASE}\t%{SIZE}\t%{LICENSE}\n" $(cut -f1 /tmp/added)' \
            > "$WORK/evidence/fedora-llama-cpp-added-packages.tsv"

      - name: The proof, with the smallest model
        run: |
          docker exec fedora setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups -- \
            python3 /w/services/tur-ai-local/ci/local_ai_ci.py proof \
              --tal "$WORK/bin/tur-ai-local" --catalogue /w/services/tur-ai-local/catalogue \
              --data "$WORK/data" --runtime "$WORK/run" --evidence "$WORK/evidence/fedora" \
              --model qwen3-0.6b --idle 30

      - name: Every catalogue model
        if: ${{ !cancelled() }}
        run: |
          docker exec fedora setpriv --reuid="$(id -u)" --regid="$(id -g)" --clear-groups -- \
            python3 /w/services/tur-ai-local/ci/local_ai_ci.py table \
              --tal "$WORK/bin/tur-ai-local" --catalogue /w/services/tur-ai-local/catalogue \
              --data "$WORK/data" --runtime "$WORK/run" --evidence "$WORK/evidence/fedora" \
              --models "$FIRST_LIST" \
              --label fedora-llama-cpp-b9840 --remove-after --keep qwen3-0.6b

      - name: Summary
        if: always()
        run: |
          python3 services/tur-ai-local/ci/local_ai_ci.py summary --evidence "$WORK/evidence" --out "$WORK/evidence/summary.md" >/dev/null || true
          cat "$WORK/evidence/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          docker exec fedora bash -c "cat $WORK/run/tur-ai-local/engine.log 2>/dev/null | tail -n 80" > "$WORK/evidence/engine-log-tail.txt" || true
          docker rm -f fedora >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: local-ai-fedora-evidence
          path: ${{ runner.temp }}/local-ai/evidence/
          if-no-files-found: warn

  compare:
    name: Engine comparison — llama.cpp's own build and Fedora's Ollama
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Room on the disk
        run: |
          WORK="$RUNNER_TEMP/local-ai"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          mkdir -p "$WORK/bin" "$WORK/data" "$WORK/run" "$WORK/evidence"

      - name: Toolchain
        working-directory: services/tur-ai-local
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            services/tur-ai-local/target
          key: local-ai-release-${{ hashFiles('rust-toolchain.toml', 'services/tur-ai-local/Cargo.toml', 'services/tur-ai-local/Cargo.lock') }}
          restore-keys: local-ai-release-

      - name: Build tur-ai-local
        working-directory: services/tur-ai-local
        run: |
          if [ -f Cargo.lock ]; then cargo build --release --locked; else cargo build --release; fi
          install -m 0755 target/release/tur-ai-local "$WORK/bin/tur-ai-local"

      - name: The smallest model, from the cache when it is there
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/local-ai/data/tur/models/qwen3-0.6b
          key: local-ai-model-qwen3-0.6b-9465e63a22add5354d9bb4b99e90117043c7124007664907259bd16d043bb031

      - name: llama.cpp's own release build, checked
        run: |
          curl -fsSL -o "$WORK/llama.tar.gz" "$UPSTREAM_URL"
          echo "$UPSTREAM_SHA256  $WORK/llama.tar.gz" | sha256sum -c -
          mkdir -p "$WORK/upstream" && tar -xzf "$WORK/llama.tar.gz" -C "$WORK/upstream"
          server="$(find "$WORK/upstream" -name llama-server -type f | head -n 1)"
          echo "UPSTREAM_SERVER=$server" >> "$GITHUB_ENV"
          ls -la "$(dirname "$server")" | tee "$WORK/evidence/upstream-files.txt"
          "$server" --version 2>&1 | tail -n 3 | tee -a "$WORK/evidence/upstream-files.txt"

      - name: Every catalogue model with llama.cpp's own build
        run: |
          python3 services/tur-ai-local/ci/local_ai_ci.py table \
            --tal "$WORK/bin/tur-ai-local" --catalogue services/tur-ai-local/catalogue \
            --data "$WORK/data" --runtime "$WORK/run" --evidence "$WORK/evidence/upstream" \
            --models "$FIRST_LIST,gemma-4-e2b" \
            --engine "$UPSTREAM_SERVER" --label upstream-llama-cpp-b9840-cpu --remove-after --keep qwen3-0.6b

      - name: Fedora 45's Ollama, with the same model file
        if: ${{ !cancelled() }}
        run: |
          "$WORK/bin/tur-ai-local" pull qwen3-0.6b --catalogue services/tur-ai-local/catalogue --models-dir "$WORK/data/tur/models"
          docker run -d --name fedora --network host -v "$WORK:$WORK" "$FEDORA_IMAGE" sleep infinity
          docker exec fedora bash -c 'rpm -qa --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\t%{SIZE}\n" | sort > /tmp/before'
          docker exec fedora dnf -y --setopt=install_weak_deps=False install "$OLLAMA_RPM" 2>&1 | tail -n 30 | tee "$WORK/evidence/dnf-ollama.txt"
          docker exec fedora bash -c '
            rpm -qa --qf "%{NAME}-%{VERSION}-%{RELEASE}.%{ARCH}\t%{SIZE}\n" | sort > /tmp/after
            comm -13 /tmp/before /tmp/after > /tmp/added
            echo "packages added: $(wc -l < /tmp/added)"
            awk -F"\t" "{s+=\$2} END {printf \"installed size of the added packages: %.0f MB\n\", s/1e6}" /tmp/added
            cat /tmp/added; rpm -q --qf "%{LICENSE}\n" ollama-base; ls -la /usr/lib/ollama; ollama --version 2>&1 | tail -n 2' \
            | tee "$WORK/evidence/fedora-ollama.txt"
          docker exec fedora bash -c 'rpm -q --qf "%{NAME}\t%{VERSION}-%{RELEASE}\t%{SIZE}\t%{LICENSE}\n" $(cut -f1 /tmp/added)' \
            > "$WORK/evidence/fedora-ollama-added-packages.tsv"
          docker exec -d -e OLLAMA_HOST=127.0.0.1:11434 -e OLLAMA_MODELS=/tmp/ollama-models -e OLLAMA_NO_CLOUD=1 \
            -e OLLAMA_KEEP_ALIVE=10m fedora bash -c 'ollama serve > /tmp/ollama.log 2>&1'
          for _ in $(seq 1 60); do curl -fsS http://127.0.0.1:11434/api/version && break; sleep 1; done
          echo
          model="$WORK/data/tur/models/qwen3-0.6b/Qwen3-0.6B-Q8_0.gguf"
          printf 'FROM %s\nPARAMETER num_ctx 8192\n' "$model" > "$WORK/Modelfile"
          docker exec -e OLLAMA_HOST=127.0.0.1:11434 fedora ollama create qwen3-local -f "$WORK/Modelfile" 2>&1 | tail -n 5
          docker exec -e OLLAMA_HOST=127.0.0.1:11434 fedora ollama show qwen3-local 2>&1 | tee "$WORK/evidence/ollama-show.txt"
          python3 - <<'PY' | tee "$WORK/evidence/ollama-listening.txt"
          from pathlib import Path
          import socket
          for line in Path("/proc/net/tcp").read_text().splitlines()[1:]:
              fields = line.split()
              address, port = fields[1].split(":")
              if fields[3] == "0A" and int(port, 16) == 11434:
                  print("Ollama listens on", socket.inet_ntoa(bytes.fromhex(address)[::-1]), 11434)
          PY
          python3 services/tur-ai-local/ci/local_ai_ci.py ollama --ollama-url http://127.0.0.1:11434 \
            --ollama-model qwen3-local --evidence "$WORK/evidence/ollama"
          docker exec fedora tail -n 60 /tmp/ollama.log > "$WORK/evidence/ollama-log-tail.txt" || true

      - name: Summary
        if: always()
        run: |
          python3 services/tur-ai-local/ci/local_ai_ci.py summary --evidence "$WORK/evidence" --out "$WORK/evidence/summary.md" >/dev/null || true
          cat "$WORK/evidence/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          docker rm -f fedora >/dev/null 2>&1 || true

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: local-ai-compare-evidence
          path: ${{ runner.temp }}/local-ai/evidence/
          if-no-files-found: warn

  pax:
    name: P@x through the local preset (${{ matrix.model }}, ${{ matrix.via }}), against tur-ai-local
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # The catalogue's first recommendation for an assistant that acts,
          # downloaded with pull and served with serve, three tasks.
          - model: qwen3-4b
            via: pull
            tasks: two-tools,local-ai,readonly-command
            cache: local-ai-model-qwen3-4b-7485fe6f11af29433bc51cab58009521f205840f5b4ae3a32fa7f92e8534fdf5
          # The smallest model of the second list, made ready by one
          # `tur-ai-local ensure` as P@x's service does when a person chooses
          # it: downloaded from the publisher, checked, started. Its
          # licence shows a restriction, accepted here as a person would.
          # One task.
          - model: ministral-3-3b
            via: ensure
            tasks: two-tools
            cache: local-ai-model-ministral-3-3b-9ed150d4367e68df0ac8e1540f6ddc65b42d0ee26378329d1ecbca60f93fc5f8
    env:
      DEBIAN_FRONTEND: noninteractive
      # On llama.cpp's own build (Fedora's reads a P@x request too slowly:
      # docs/reports/local-ai-1.md, section 3).
      PAX_MODEL: ${{ matrix.model }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Room on the disk
        run: |
          WORK="$RUNNER_TEMP/local-ai"
          echo "WORK=$WORK" >> "$GITHUB_ENV"
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          mkdir -p "$WORK/bin" "$WORK/data" "$WORK/run" "$WORK/evidence/pax" "$WORK/pax"
          chmod 0700 "$WORK/run"
          python3 -m py_compile tests/pax/local_model.py

      - name: Install bubblewrap
        run: |
          sudo apt-get update >/dev/null
          sudo apt-get install -y bubblewrap util-linux >/dev/null

      - name: Sandbox preflight
        # P@x's own preflight: the sandbox is not optional.
        run: tests/pax/sandbox-preflight.sh "$WORK/evidence/sandbox-preflight.txt"

      - name: Toolchain
        working-directory: services/tur-pax
        run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            services/*/target
          key: local-ai-pax-${{ hashFiles('rust-toolchain.toml', 'services/*/Cargo.lock') }}
          restore-keys: local-ai-pax-

      - name: Discover the tool sets
        # The rule P@x reads them by: services/<component>/agent-tools.json
        # with agent-tools.adapter.json beside it. No component is named
        # here. Each program an adapter starts is built from its component.
        run: |
          python3 - > "$WORK/programs.tsv" <<'PY'
          import json, pathlib, sys
          rows = set()
          for adapters in sorted(pathlib.Path("services").glob("*/agent-tools.adapter.json")):
              component = adapters.parent.name
              for adapter in json.loads(adapters.read_text())["adapters"]:
                  program = adapter["program"]
                  if not program.startswith("/usr/bin/"):
                      sys.exit(f"{component}: {program} is not a program in /usr/bin")
                  rows.add((component, program))
          for component, program in sorted(rows):
              print(f"{component}\t{program}")
          PY
          tee "$WORK/evidence/pax/tool-programs.tsv" < "$WORK/programs.tsv"

      - name: Build tur-pax, the tool programs and tur-ai-local
        run: |
          (cd services/tur-pax && cargo build --locked)
          while IFS="$(printf '\t')" read -r component program; do
            echo "::group::cargo build: $component ($(basename "$program"))"
            (cd "services/$component" && cargo build --locked --bin "$(basename "$program")")
            echo "::endgroup::"
          done < "$WORK/programs.tsv"
          (cd services/tur-ai-local && cargo build --release --locked)
          install -m 0755 services/tur-ai-local/target/release/tur-ai-local "$WORK/bin/tur-ai-local"

      - name: Put the programs, the catalogues and the tools in place
        # Where the shipped adapters expect them. Every component's tool set
        # is installed as tur-pax reads an installed directory of tool sets;
        # the fixture tool is P@x's test fixture.
        run: |
          while IFS="$(printf '\t')" read -r component program; do
            sudo install -m 0755 "services/$component/target/debug/$(basename "$program")" "$program"
          done < "$WORK/programs.tsv"
          sudo mkdir -p /usr/share/tur/ai-local /usr/share/tur-pax-e2e
          sudo cp -r catalogue /usr/share/tur/catalogue
          sudo cp -r services/tur-ai-local/catalogue /usr/share/tur/ai-local/models
          sudo cp -r services/tur-device-manager/tests/fixtures/laptop /usr/share/tur-pax-e2e/laptop
          tools="$WORK/pax/tools"
          for component in services/*/; do
            if [ -f "$component/agent-tools.json" ]; then
              name="$(basename "$component")"
              install -D -m 0644 "$component/agent-tools.json" "$tools/$name/agent-tools.json"
              install -D -m 0644 "$component/agent-tools.adapter.json" "$tools/$name/agent-tools.adapter.json"
            fi
          done
          mkdir -p "$WORK/pax/manifests" "$WORK/pax/adapters"
          cp tests/pax/manifests/fixture.json "$WORK/pax/manifests/fixture.json"
          cp tests/pax/adapters/fixture.json "$WORK/pax/adapters/fixture.json"
          find "$tools" "$WORK/pax/manifests" "$WORK/pax/adapters" -type f | sort | tee "$WORK/evidence/pax/tool-sets.txt"

      - name: The model, from the cache when it is there
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/local-ai/data/tur/models/${{ matrix.model }}
          key: ${{ matrix.cache }}

      - name: The model, through tur-ai-local pull
        if: matrix.via == 'pull'
        # Downloaded and checked against the catalogue's digest, or checked
        # again when it came from the cache.
        run: |
          "$WORK/bin/tur-ai-local" pull "$PAX_MODEL" --catalogue services/tur-ai-local/catalogue --models-dir "$WORK/data/tur/models"

      - name: llama.cpp's own release build, checked
        # For the 4B model: with Fedora's build it processed prompts at
        # 1.5 to 1.8 tokens per second in run 43277339192, so one P@x
        # request of 1 000 to 3 000 tokens took 10 to 30 minutes.
        run: |
          curl -fsSL -o "$WORK/llama.tar.gz" "$UPSTREAM_URL"
          echo "$UPSTREAM_SHA256  $WORK/llama.tar.gz" | sha256sum -c -
          mkdir -p "$WORK/upstream" && tar -xzf "$WORK/llama.tar.gz" -C "$WORK/upstream"
          echo "UPSTREAM_SERVER=$(find "$WORK/upstream" -name llama-server -type f | head -n 1)" >> "$GITHUB_ENV"

      - name: The model, through one tur-ai-local ensure
        if: matrix.via == 'ensure'
        # What P@x's service runs when a person chooses a local model
        # (UseLocalModel): the licence accepted, the disk checked, the
        # files downloaded from the publisher (or found in the cache) and
        # checked, the engine started; its progress as JSON lines. The
        # events are kept as evidence and checked against the report
        # schema. The files are hashed again afterwards, so that a cached
        # copy is proved too.
        run: |
          events="$WORK/evidence/pax/ensure-$PAX_MODEL.jsonl"
          started=$(date +%s)
          status=0
          "$WORK/bin/tur-ai-local" ensure "$PAX_MODEL" --json --accept-licence --reasoning auto \
            --idle-stop 3600 --start-timeout 900 --engine "$UPSTREAM_SERVER" \
            --catalogue services/tur-ai-local/catalogue --models-dir "$WORK/data/tur/models" --runtime-dir "$WORK/run" \
            > "$events" 2> "$events.err" || status=$?
          echo "ensure took $(( $(date +%s) - started )) s, exit $status"
          grep -v '"event":"progress"' "$events" || true
          cat "$events.err"
          test "$status" -eq 0
          python3 - "$events" <<'PY'
          import json, sys
          events = [json.loads(line) for line in open(sys.argv[1]) if line.strip()]
          names = [event["event"] for event in events]
          assert names[-1] == "ready", names
          assert names[0] in ("plan", "already-present"), names
          if names[0] == "plan":
              assert "installed" in names and names.count("verified") == 2, names
          assert all(event["kind"] == "ensure-event" and event["model"] == events[0]["model"] for event in events)
          print("ensure events:", ", ".join(sorted(set(names))))
          PY
          "$WORK/bin/tur-ai-local" verify "$PAX_MODEL" --catalogue services/tur-ai-local/catalogue --models-dir "$WORK/data/tur/models"

      - name: P@x through the local preset
        # tur-ai-local serves the model as it would for a person: on
        # 127.0.0.1:39281, its default address, with a new access key in
        # $WORK/run/tur-ai-local/api-key and its default context (started
        # here with serve, or already by ensure). P@x is `tur-pax run
        # --provider local --model <model>`: the preset gives the address,
        # the model's generation settings and reads that key file; the
        # read-only command tool is on, in the real sandbox. What the model
        # does is recorded; what fails the step is listed in
        # tests/pax/local_model.py.
        run: |
          log="$WORK/run/serve-$PAX_MODEL.log"
          if [ "${{ matrix.via }}" = pull ]; then
            "$WORK/bin/tur-ai-local" serve "$PAX_MODEL" --json --idle-stop 3600 --engine "$UPSTREAM_SERVER" \
              --catalogue services/tur-ai-local/catalogue --models-dir "$WORK/data/tur/models" --runtime-dir "$WORK/run" \
              > "$log" 2> "$log.err" &
            for _ in $(seq 1 600); do grep -q '"event":"ready"' "$log" 2>/dev/null && break; sleep 1; done
            if ! grep -q '"event":"ready"' "$log"; then
              echo "::error::the engine did not become ready with $PAX_MODEL"; cat "$log.err"; exit 1
            fi
            grep '"event":"ready"' "$log"
          fi
          "$WORK/bin/tur-ai-local" status --json --runtime-dir "$WORK/run" | tee "$WORK/evidence/pax/status-$PAX_MODEL.json"
          set +e
          python3 tests/pax/local_model.py \
            --tur-pax services/tur-pax/target/debug/tur-pax \
            --models services/tur-pax/data/models.json \
            --tools "$WORK/pax/tools" \
            --fixture-manifests "$WORK/pax/manifests" --fixture-adapters "$WORK/pax/adapters" \
            --runtime-dir "$WORK/run" --engine-log "$WORK/run/tur-ai-local/engine.log" \
            --model "$PAX_MODEL" --engine upstream-llama-cpp-b9840-cpu --tasks "${{ matrix.tasks }}" \
            --work-dir "$WORK/pax/work" --evidence "$WORK/evidence/pax"
          status=$?
          cp "$WORK/run/tur-ai-local/engine.log" "$WORK/evidence/pax/engine-$PAX_MODEL.log" 2>/dev/null || true
          "$WORK/bin/tur-ai-local" stop --runtime-dir "$WORK/run"
          exit $status

      - name: Summary
        if: always()
        run: |
          cat "$WORK"/evidence/pax/pax-local-*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          python3 services/tur-ai-local/ci/local_ai_ci.py summary --evidence "$WORK/evidence" --out "$WORK/evidence/summary.md" >/dev/null || true
          cat "$WORK/evidence/summary.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          cp "$WORK"/run/serve-*.log "$WORK"/run/serve-*.err "$WORK/evidence/" 2>/dev/null || true

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: local-ai-pax-evidence-${{ matrix.model }}
          path: ${{ runner.temp }}/local-ai/evidence/
          if-no-files-found: warn
