#
# Keeps every image CI pins by digest pullable. See image/README.md, "The base
# image and its mirror", docs/reports/base-mirror-1.md and
# docs/reports/base-mirror-2.md.
#
# Fedora moves quay.io/fedora/fedora-kinoite:45 and quay.io/fedora/fedora:45
# every day, and quay.io removes the manifest the tag pointed to about a day
# later. A pin therefore stops resolving within a day or two. This workflow
# copies every pinned digest, unchanged (skopeo copy --all --preserve-digests),
# to a package in GitHub's registry while upstream still has it: the package
# .github/actions/use-base-mirror/mirrors.tsv names for its repository
# (ghcr.io/giorgiogiudice/tur-base for the OS base). pins.py there finds the
# pins in the repository; a digest it does not understand, or a pin whose
# repository has no mirror, fails the lint. The workflows that pull a pinned
# image use the action, which declares each package as a digest-only mirror
# of its repository for podman and skopeo, and gives docker the mirror's
# reference, so they keep working after upstream has dropped the digest.
#
# Jobs:
#   mirror          copy every pin and check the copies (pull requests from
#                   this repository, pushes to main, daily, by hand)
#   through-mirror  build the image with quay.io unreachable, from the mirror
#                   alone; show that a digest never mirrored fails clearly
#                   (when the base pin or the mirror mechanism changes, and by
#                   hand)
#   pin-age         weekly: open or update one issue listing every pin whose
#                   tag moved on more than seven days ago (on a pull request
#                   it only reports)
name: base-mirror

on:
  push:
    branches: [main]
    paths:
      # Where pins are written (pins.py reads these and tests/ and scripts/).
      - ".github/workflows/**"
      - ".github/actions/use-base-mirror/**"
      - "**/*.lock"
      - "!**/Cargo.lock"
      - "**/Containerfile"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/use-base-mirror/**"
      - "**/*.lock"
      - "!**/Cargo.lock"
      - "**/Containerfile"
  schedule:
    # Weekly: the pin-age report (and a copy of every pin).
    - cron: "23 7 * * 1"
    # Daily: a copy of every pin, for one that reached main without a run of
    # this workflow (a pull request from a fork has no write access).
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: base-mirror-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PINS: .github/actions/use-base-mirror/pins.py
  # A digest of the base that quay.io removed on 13 November 2026 and that was
  # never mirrored. It must keep failing, with a message that says why.
  NEVER_MIRRORED: quay.io/fedora/fedora-kinoite@sha256:f857f6c5da48a7c39721e40de51d9c0fef446a25e0360be4fb8964cbdf48f537 # pins.py: ignore

jobs:
  mirror:
    name: Copy every pinned image to its mirror
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      through: ${{ steps.scope.outputs.through }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lint
        run: |
          shellcheck -x .github/actions/use-base-mirror/*.sh
          python3 -m py_compile .github/actions/use-base-mirror/*.py
          python3 -I "$PINS" self-test

      - name: Every digest in the repository is a pin, and every pin has a mirror
        run: |
          python3 -I "$PINS" list
          python3 -I "$PINS" check

      - name: Log in to the mirrors' registry
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          skopeo --version
          printf '%s' "$TOKEN" | skopeo login --username "$ACTOR" --password-stdin ghcr.io

      # The copy is made from upstream while it has the digest, and from the
      # mirror itself (to add a missing tag) when it no longer does. Each
      # mirror says whether it can be read without credentials; its
      # visibility is the owner's setting and is not changed here.
      - name: Copy every pinned digest, and check the copies
        run: python3 -I "$PINS" copy

      - name: Does this change touch the base or the mirror mechanism?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          event = os.environ["EVENT"]
          through, why = event == "workflow_dispatch", event
          if event in ("pull_request", "push"):
              req = urllib.request.Request(
                  f"https://api.github.com/repos/{os.environ['REPO']}/compare/{os.environ['BASE']}...{os.environ['HEAD']}",
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}", "Accept": "application/vnd.github+json"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      files = [f["filename"] for f in json.load(r).get("files", [])]
                  hit = [f for f in files if re.match(r"(image/base\.lock|scripts/build-image\.sh|"
                                                      r"\.github/actions/use-base-mirror/|\.github/workflows/base-mirror\.yml)", f)]
                  through, why = bool(hit), ", ".join(hit) or "no file of the base or the mechanism changed"
              except Exception as err:  # noqa: BLE001  when in doubt, build
                  through, why = True, f"the changed files could not be listed: {err}"
          print(f"through-mirror: {'yes' if through else 'no'} ({why})")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"through={'true' if through else 'false'}\n")
          PY

  through-mirror:
    if: needs.mirror.outputs.through == 'true'
    name: Build from the mirror with quay.io unreachable
    needs: mirror
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      PODMAN: sudo podman
      IMAGE: localhost/tur:through-mirror
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The images list only logs docker in to ghcr.io here.
      - uses: ./.github/actions/use-base-mirror
        with:
          images: desktop/ci/builder.lock

      - name: A digest that was never mirrored fails, and says why
        run: |
          echo "--- check.sh ${NEVER_MIRRORED}"
          status=0
          .github/actions/use-base-mirror/check.sh "$NEVER_MIRRORED" || status=$?
          if [ "$status" -ne 1 ]; then echo "expected check.sh to fail with 1, got ${status}"; exit 1; fi
          echo "--- pins.py resolve ${NEVER_MIRRORED}"
          if python3 -I "$PINS" resolve "$NEVER_MIRRORED"; then
            echo "pins.py resolved a digest that was never mirrored: unexpected"; exit 1
          fi
          echo "--- sudo podman pull ${NEVER_MIRRORED}"
          if sudo podman pull "$NEVER_MIRRORED"; then
            echo "the pull of a digest that was never mirrored succeeded: unexpected"; exit 1
          fi
          echo "failed as expected"

      - name: Make quay.io unreachable
        run: |
          echo "0.0.0.0 quay.io cdn.quay.io cdn01.quay.io cdn02.quay.io cdn03.quay.io" | sudo tee -a /etc/hosts
          if curl -sS --max-time 15 -o /dev/null https://quay.io/v2/; then
            echo "quay.io is still reachable"; exit 1
          fi
          # shellcheck source=/dev/null
          . image/base.lock
          echo "--- quay.io asked directly for the pin (must fail):"
          if python3 -I .github/actions/use-base-mirror/upstream.py "${BASE_IMAGE}@${BASE_DIGEST}"; then
            echo "quay.io answered"; exit 1
          fi

      - name: Every quay.io pin resolves through its mirror, as root and as the runner user
        run: |
          python3 -I "$PINS" list --json \
            | python3 -c 'import json,sys; [print(r) for r in dict.fromkeys(p["repo"] + "@" + p["digest"] for p in json.load(sys.stdin) if p["repo"].startswith("quay.io/"))]' \
            > "$RUNNER_TEMP/quay-pins"
          while read -r ref; do
            .github/actions/use-base-mirror/check.sh "$ref"
            AS_ROOT=no .github/actions/use-base-mirror/check.sh "$ref"
          done < "$RUNNER_TEMP/quay-pins"
          # shellcheck source=/dev/null
          . image/base.lock
          echo "--- where skopeo looks for ${BASE_IMAGE}@${BASE_DIGEST}:"
          sudo skopeo --debug inspect --raw "docker://${BASE_IMAGE}@${BASE_DIGEST}" 2>&1 >/dev/null \
            | grep -E 'Trying to access|Looking for TLS|reference rewritten|Returning credentials' | sed 's/^/  /' || true

      - name: docker pulls the desktop builder's Fedora base from its mirror
        run: |
          # shellcheck source=/dev/null
          . desktop/ci/builder.lock
          ref="$(python3 -I "$PINS" resolve "${BASE_IMAGE}@${BASE_DIGEST}")"
          echo "resolved: ${ref}"
          case "$ref" in ghcr.io/*) ;; *) echo "expected the mirror's reference"; exit 1 ;; esac
          docker pull --quiet "$ref"
          docker image inspect -f '{{.Id}} {{.RepoDigests}}' "$ref"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Build the image (quay.io unreachable)
        run: |
          start=$(date +%s)
          TUR_BUILD_ID_FILE="$RUNNER_TEMP/build-id" scripts/build-image.sh "$IMAGE"
          echo "BUILD_ID=$(cat "$RUNNER_TEMP/build-id")" >> "$GITHUB_ENV"
          echo "image build: $(( $(date +%s) - start )) s"

      - name: The image was built FROM the pinned digest, under its quay.io name
        run: |
          # shellcheck source=/dev/null
          . image/base.lock
          ref="${BASE_IMAGE}@${BASE_DIGEST}"
          fail=0
          label() { $PODMAN image inspect --format "{{index .Labels \"$1\"}}" "$IMAGE"; }
          expect() { if [ "$2" = "$3" ]; then echo "ok    $1: $2"; else echo "FAIL  $1: $2, expected $3"; fail=1; fi; }
          expect "label org.tur.base.image" "$(label org.tur.base.image)" "$BASE_IMAGE"
          expect "label org.tur.base.digest" "$(label org.tur.base.digest)" "$BASE_DIGEST"
          echo "base in local storage: $($PODMAN image inspect --format '{{.Id}} {{.RepoDigests}}' "$ref")"
          if $PODMAN image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$ref" | grep -qxF "$ref"; then
            echo "ok    the base is stored as ${ref}"
          else
            echo "FAIL  the base is not stored as ${ref}"; fail=1
          fi
          exit "$fail"

      - name: Image smoke tests
        run: tests/image/smoke.sh "$IMAGE" "$BUILD_ID"

  pin-age:
    name: Are the pins more than seven days old?
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.event.schedule == '23 7 * * 1')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to the mirrors' registry
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: printf '%s' "$TOKEN" | skopeo login --username "$ACTOR" --password-stdin ghcr.io

      # Only the weekly run and a run by hand write to the issue tracker.
      - name: Compare every pin with its tag upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WRITE: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          MAX_AGE_DAYS: "7"
        run: |
          if [ "$WRITE" = true ]; then python3 -I "$PINS" age --write; else python3 -I "$PINS" age; fi
