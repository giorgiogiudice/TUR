name: image

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      # TUR's artwork, installed by image/branding/branding.sh.
      - "branding/**"
      # Programs compiled into the image (image/programs.tsv), what they are
      # compiled with, and what is installed beside them.
      - "services/tur-ai-local/**"
      - "services/tur-apps/**"
      - "services/tur-boot-health/**"
      - "services/tur-catalogue/**"
      - "services/tur-device-manager/**"
      - "services/tur-diagnostics/**"
      - "services/tur-pax/**"
      - "services/tur-pax-memory/**"
      - "services/tur-pax-policy/**"
      - "services/tur-pax-providers/**"
      - "services/tur-runtime/**"
      - "services/tur-storage/**"
      - "services/tur-update/**"
      - "installer/tur-installer-core/**"
      - "catalogue/**"
      - "crates/**"
      - "LICENSE.md"
      - "NOTICE"
      - "rust-toolchain.toml"
      - "scripts/*.sh"
      - "scripts/*.py"
      - "schemas/build-manifest.schema.json"
      - "tests/image/**"
      - "VERSION"
      - ".containerignore"
      - ".github/workflows/image.yml"
  pull_request:
    paths:
      - "image/**"
      # TUR's artwork, installed by image/branding/branding.sh.
      - "branding/**"
      # Programs compiled into the image (image/programs.tsv), what they are
      # compiled with, and what is installed beside them.
      - "services/tur-ai-local/**"
      - "services/tur-apps/**"
      - "services/tur-boot-health/**"
      - "services/tur-catalogue/**"
      - "services/tur-device-manager/**"
      - "services/tur-diagnostics/**"
      - "services/tur-pax/**"
      - "services/tur-pax-memory/**"
      - "services/tur-pax-policy/**"
      - "services/tur-pax-providers/**"
      - "services/tur-runtime/**"
      - "services/tur-storage/**"
      - "services/tur-update/**"
      - "installer/tur-installer-core/**"
      - "catalogue/**"
      - "crates/**"
      - "LICENSE.md"
      - "NOTICE"
      - "rust-toolchain.toml"
      - "scripts/*.sh"
      - "scripts/*.py"
      - "schemas/build-manifest.schema.json"
      - "tests/image/**"
      - "VERSION"
      - ".containerignore"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

env:
  PODMAN: sudo podman
  IMAGE: localhost/tur:ci

jobs:
  build:
    name: Build, test and describe the image
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/use-base-mirror

      - name: Lint scripts
        run: |
          shellcheck -x scripts/*.sh tests/image/*.sh image/*.sh image/branding/*.sh image/engine/*.sh
          python3 -m py_compile scripts/*.py tests/image/*.py

      - name: Runner environment
        run: |
          echo "podman: $(podman --version)"
          echo "kernel: $(uname -r)"
          nproc; free -g | sed -n 2p
          if [ -e /dev/kvm ]; then echo "kvm: present ($(stat -c '%A %U:%G' /dev/kvm))"; else echo "kvm: ABSENT"; fi
          df -h / | tail -1

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Build image
        id: build
        run: |
          start=$(date +%s)
          TUR_BUILD_ID_FILE="$RUNNER_TEMP/build-id" scripts/build-image.sh "$IMAGE"
          echo "BUILD_ID=$(cat "$RUNNER_TEMP/build-id")" >> "$GITHUB_ENV"
          echo "IMAGE_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          echo "image build: $(( $(date +%s) - start )) s"
          $PODMAN image inspect -f 'image id: {{.Id}}  size: {{.Size}} bytes' "$IMAGE"

      # The steps below each look at the built image from another side. One
      # that fails does not stop the others: a run then says everything that
      # is wrong, not only the first thing.
      - name: Image smoke tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tests/image/smoke.sh "$IMAGE" "$BUILD_ID"

      - name: Reproducibility check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          start=$(date +%s)
          scripts/build-image.sh localhost/tur:repro --no-cache
          echo "second build, without cache: $(( $(date +%s) - start )) s"
          a=$($PODMAN image inspect -f '{{.Id}}' "$IMAGE")
          b=$($PODMAN image inspect -f '{{.Id}}' localhost/tur:repro)
          echo "first:  $a"; echo "second: $b"
          if [ "$a" != "$b" ]; then
            # Say which of the files TUR adds differ between the two builds.
            list='cd / && find usr/bin/tur-* usr/libexec/tur usr/lib/tur usr/share/tur usr/share/licenses/tur usr/share/licenses/tur-third-party usr/lib/os-release usr/lib/modules/*/initramfs.img usr/share/plymouth/themes/tur usr/share/wallpapers/Tur usr/share/icons/hicolor/icon-theme.cache usr/lib/sysimage/rpm -type f | LC_ALL=C sort | xargs sha256sum'
            $PODMAN run --rm --network none "$IMAGE" /bin/bash -c "$list" > "$RUNNER_TEMP/first.sha256"
            $PODMAN run --rm --network none localhost/tur:repro /bin/bash -c "$list" > "$RUNNER_TEMP/second.sha256"
            echo "files TUR adds that differ between the two builds:"
            diff "$RUNNER_TEMP/first.sha256" "$RUNNER_TEMP/second.sha256" | head -n 60 || true
            exit 1
          fi

      # Fedora's marks (desktop-experience.md, 12.5): fails on anything the
      # allow-list (tests/image/marks-allowlist.tsv) does not account for. The
      # inventory beside it is for a person to read (docs/reports/TUR-008.md).
      - name: Fedora's marks
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          status=0
          python3 tests/image/marks.py "$IMAGE" out || status=$?
          cat out/marks.md >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

      - name: Inventory of Fedora's name in the image (informational)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: tests/image/marks-inventory.sh "$IMAGE" out

      - name: SBOM and licence summary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/sbom.sh "$IMAGE" out

      - name: Build manifest
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sudo apt-get install -y --no-install-recommends python3-jsonschema >/dev/null
          scripts/gen-manifest.py "$IMAGE" out/build-manifest.json --sbom sbom.spdx.json >/dev/null
          scripts/validate-manifest.py out/build-manifest.json

      # Informational: what it finds is for a person to judge (TUR-006).
      - name: Built-in names of the policy engine, held against the image
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 tests/image/identifiers.py "$IMAGE" out
          cat out/identifiers.md >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          scripts/manifest-summary.py out/build-manifest.json >> "$GITHUB_STEP_SUMMARY"
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "Image build: ${IMAGE_BUILD_SECONDS:-not measured} s." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: tur-image-metadata
          path: out/
          if-no-files-found: warn

      # The image every step above tested, kept for the release workflow,
      # which publishes it without building it again (ADR-0023;
      # docs/architecture/publishing.md). Only when every step passed. The
      # image ID is the digest of the image's configuration, which names
      # every layer by the digest of its content: the release workflow
      # checks it before it uses the archive.
      - name: Export the tested image for the release workflow
        if: success()
        run: |
          dir="$RUNNER_TEMP/tur-image"
          mkdir -p "$dir"
          $PODMAN image inspect -f '{{.Id}}' "$IMAGE" > "$dir/image-id"
          echo "$BUILD_ID" > "$dir/build-id"
          git rev-parse HEAD > "$dir/source-revision"
          start=$(date +%s)
          sudo skopeo copy --quiet --dest-compress-format zstd \
            "containers-storage:$IMAGE" "oci-archive:$dir/tur-image.oci.tar"
          sudo chown "$(id -u):$(id -g)" "$dir/tur-image.oci.tar"
          echo "export: $(( $(date +%s) - start )) s"
          ls -la "$dir"; cat "$dir/image-id" "$dir/build-id" "$dir/source-revision"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: success()
        with:
          name: tur-image-oci
          path: ${{ runner.temp }}/tur-image/
          compression-level: 0
          retention-days: 5
          if-no-files-found: error
