# SPDX-License-Identifier: LicenseRef-TUR-Noncommercial-1.0.0
#
# TUR's build of Darling (docs/reports/macos-darling-1.md): Darling built
# from source at the commit pinned in scripts/darling/darling.lock, with
# TUR's patch queue (third-party/darling/patches) applied, on the OS image's
# pinned base, as one archive that a person's computer fetches when it first
# installs a macOS application (tur-runtime mac runtime fetch), checked by
# its SHA-256.
#
# Started by hand only (workflow_dispatch): no pull_request, push or schedule
# trigger. A cold build of Darling takes an hour or more; GitHub Actions was
# disabled for the owner's account after the project drove too much CI load,
# and this workflow adds none until the lead starts it. One run at a time.
#
# build    podman build of scripts/darling/Containerfile: fetch with network,
#          compile without; the archive and build-record.json as an artifact.
#          The build refuses the archive if anything Apple-signed, any header
#          or SDK, or Apple's Swift runtime is left in it, or if a host
#          library it needs is not in the base (scripts/darling/check-tree.py).
# publish  only when the lead sets `publish`: pushes the archive to the
#          repository's own package registry (ghcr.io) with ORAS, checks that
#          the registry's digest is the archive's SHA-256, and prints the
#          manifest entry for services/tur-runtime/darling/runtime.json.
name: darling-runtime

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the archive to the repository's package registry (ghcr.io)"
        type: boolean
        default: false
      allow_missing_host_libraries:
        description: "Finish a build whose host libraries are not all in the base, for a look (never published)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: read   # the pinned base from TUR's mirror (ghcr.io)

concurrency:
  group: darling-runtime
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build Darling from source on the pinned base
    runs-on: ubuntu-24.04
    # A cold build: about an hour to two (Darling's CI needs 15 to 20
    # minutes with a warm ccache for more components than TUR builds).
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Free disk space
        # Darling's build directory takes up to 16 GB and its source 5 GB.
        # podman's storage goes to /mnt, the runner's second disk.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /mnt/darling-podman
          df -h / /mnt

      - uses: ./.github/actions/use-base-mirror

      - name: Restore ccache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.ccache-darling
          key: darling-ccache-${{ hashFiles('scripts/darling/darling.lock', 'image/base.lock') }}-${{ github.run_id }}
          restore-keys: |
            darling-ccache-${{ hashFiles('scripts/darling/darling.lock', 'image/base.lock') }}-
            darling-ccache-

      - name: Build
        env:
          DARLING_PODMAN_ROOT: /mnt/darling-podman
          DARLING_ALLOW_MISSING_HOST_LIBS: ${{ inputs.allow_missing_host_libraries && '1' || '0' }}
        run: |
          set -euo pipefail
          export DARLING_CCACHE="$HOME/.ccache-darling"
          mkdir -p "$DARLING_CCACHE"
          scripts/darling/build-darling.sh image "$RUNNER_TEMP/out"
          sudo chown -R "$(id -u):$(id -g)" ~/.ccache-darling "$RUNNER_TEMP/out" || true

      - name: Save ccache
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.ccache-darling
          key: darling-ccache-${{ hashFiles('scripts/darling/darling.lock', 'image/base.lock') }}-${{ github.run_id }}

      - name: Summary
        if: always()
        run: |
          record="$RUNNER_TEMP/out/build-record.json"
          {
            echo "## TUR's build of Darling"
            if [ -f "$record" ]; then
              echo '```json'
              jq '{id, tag, darling_commit, queue_sha256, fedora_release, base_digest, sha256, size, unpacked_size, build_seconds, removed: (.removed | length), check: {macho_files: .check.macho_files, elf_files: .check.elf_files, violations: (.check.violations | length), missing_host_libraries: [.check.missing_host_libraries[]?.soname]}}' "$record"
              echo '```'
            else
              echo "No build record: the build failed. See the log."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: darling-runtime
          path: ${{ runner.temp }}/out
          retention-days: 30
          if-no-files-found: error

  publish:
    name: Publish to the package registry
    needs: build
    if: inputs.publish && !inputs.allow_missing_host_libraries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # pushing to ghcr.io, only when the lead asks for it
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: darling-runtime
          path: ${{ runner.temp }}/out

      - name: ORAS, pinned and checked
        run: |
          set -euo pipefail
          . scripts/darling/darling.lock
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 4 -o oras.tar.gz "$ORAS_URL"
          echo "$ORAS_SHA256  oras.tar.gz" | sha256sum -c -
          curl -fsSL --retry 4 -o oras-checksums.txt "${ORAS_URL%/*}/oras_${ORAS_VERSION}_checksums.txt"
          grep "  oras_${ORAS_VERSION}_linux_amd64.tar.gz$" oras-checksums.txt | sed "s/  oras_.*/  oras.tar.gz/" | sha256sum -c -
          tar -xzf oras.tar.gz oras
          ./oras version

      - name: Push
        env:
          TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          . scripts/darling/darling.lock
          out="$RUNNER_TEMP/out"
          record="$out/build-record.json"
          tag=$(jq -r .tag "$record")
          digest=$(jq -r .sha256 "$record")
          size=$(jq -r .size "$record")
          test "$(jq '.check.missing_host_libraries | length' "$record")" = 0
          test "$(jq '.check.violations | length' "$record")" = 0
          echo "$digest  $out/darling-runtime.tar.xz" | sha256sum -c -
          test "$(stat -c %s "$out/darling-runtime.tar.xz")" = "$size"
          printf '%s' "$TOKEN" | "$RUNNER_TEMP/oras" login ghcr.io --username "$ACTOR" --password-stdin
          cd "$out"
          "$RUNNER_TEMP/oras" push "$DARLING_PACKAGE:$tag" \
            --artifact-type application/vnd.tur.darling.runtime.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "org.opencontainers.image.licenses=GPL-3.0-or-later AND MIT AND LGPL-2.1-or-later AND APSL-2.0 AND BSD-2-Clause AND BSD-3-Clause AND Apache-2.0" \
            --annotation "org.tur.darling.commit=$DARLING_COMMIT" \
            "darling-runtime.tar.xz:$DARLING_MEDIA_TYPE" \
            "build-record.json:application/json"
          # The registry holds the archive under its own SHA-256: that is what
          # tur-runtime fetches it by.
          "$RUNNER_TEMP/oras" manifest fetch "$DARLING_PACKAGE:$tag" > manifest.json
          jq -e --arg d "sha256:$digest" --arg t "$DARLING_MEDIA_TYPE" \
            '[.layers[] | select(.mediaType == $t and .digest == $d)] | length == 1' manifest.json
          {
            echo "## Published"
            echo "\`$DARLING_PACKAGE:$tag\`, archive \`sha256:$digest\`, $size bytes."
            echo
            echo "The package must be public for a computer to fetch it without signing in"
            echo "(the package's settings on GitHub, once, after the first push)."
            echo
            echo "Entry for services/tur-runtime/darling/runtime.json:"
            echo '```json'
            jq --arg repo "$DARLING_PACKAGE" '{id, architecture: "x86_64", fedora_release, base_digest, darling_commit, queue_sha256, repository: $repo, tag, sha256, size, unpacked_size, install_prefix}' "$record"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
