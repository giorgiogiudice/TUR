# SPDX-License-Identifier: LicenseRef-TUR-Noncommercial-1.0.0
#
# End-to-end proof of the P@x orchestrator: the built tur-pax, the tool
# programs it adapts, the real bubblewrap sandbox and a scripted provider.
# See tests/pax/e2e.py for what is and is not proved.
#
# Then the session service, org.tur.Agent1, on a private session bus with a
# real Secret Service (gnome-keyring) and a stand-in notification service.
# See tests/pax/service_e2e.py.
#
# No real model is called and no API key exists: the provider is a script
# that runs on the runner. This runs on Ubuntu, not on the TUR image.
name: pax

on:
  push:
    branches: [main]
    paths:
      - "services/tur-pax/**"
      - "services/tur-pax-providers/**"
      - "services/tur-pax-memory/**"
      - "services/tur-device-manager/**"
      - "services/tur-storage/**"
      - "services/tur-catalogue/**"
      - "services/tur-diagnostics/**"
      - "services/tur-runtime/**"
      - "crates/tur-core/**"
      - "catalogue/**"
      - "tests/pax/**"
      - "schemas/pax-*.json"
      - "rust-toolchain.toml"
      - ".github/workflows/pax.yml"
  pull_request:
    paths:
      - "services/tur-pax/**"
      - "services/tur-pax-providers/**"
      - "services/tur-pax-memory/**"
      - "services/tur-device-manager/**"
      - "services/tur-storage/**"
      - "services/tur-catalogue/**"
      - "services/tur-diagnostics/**"
      - "services/tur-runtime/**"
      - "crates/tur-core/**"
      - "catalogue/**"
      - "tests/pax/**"
      - "schemas/pax-*.json"
      - "rust-toolchain.toml"
      - ".github/workflows/pax.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pax-${{ github.ref }}
  cancel-in-progress: true

jobs:
  end-to-end:
    name: Run tasks against a scripted provider, in the sandbox
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Scratch directory
        # Outside the checkout, so that nothing the test writes can be
        # mistaken for source. Later steps read it as $WORK.
        run: |
          mkdir -p "$RUNNER_TEMP/pax-e2e/evidence"
          echo "WORK=$RUNNER_TEMP/pax-e2e" >> "$GITHUB_ENV"

      - name: Install bubblewrap, a message bus and a Secret Service
        # Distribution packages. Their versions are printed by the next step.
        # dbus-daemon runs the private session bus of the service test;
        # gnome-keyring is the real Secret Service the key is kept in;
        # python3-dbus and python3-gi are the test's own D-Bus client, an
        # implementation independent of the one in tur-pax.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux dbus-daemon gnome-keyring python3-dbus python3-gi

      - name: Versions
        run: |
          {
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            . /etc/os-release; echo "os: $PRETTY_NAME"
            echo "kernel: $(uname -r)"
            echo "bubblewrap: $(bwrap --version)"
            echo "util-linux: $(prlimit --version)"
            echo "python: $(python3 --version)"
            echo "packages:"
            dpkg-query -W -f '  ${Package} ${Version}\n' bubblewrap util-linux dbus-daemon gnome-keyring python3-dbus python3-gi 2>&1 || true
          } | tee "$WORK/evidence/versions.txt"
          { echo '### Versions'; echo '```'; cat "$WORK/evidence/versions.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Sandbox preflight
        # The sandbox is not optional. If bubblewrap cannot build it here,
        # the workflow fails; the test is never run without it.
        run: |
          tests/pax/sandbox-preflight.sh "$WORK/evidence/sandbox-preflight.txt"
          { echo '### Sandbox preflight'; echo '```'; cat "$WORK/evidence/sandbox-preflight.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Toolchain
        working-directory: services/tur-pax
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version; cargo --version

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            services/tur-pax/target
            services/tur-pax-memory/target
            services/tur-device-manager/target
            services/tur-storage/target
            services/tur-catalogue/target
            services/tur-diagnostics/target
            services/tur-runtime/target
          key: pax-${{ hashFiles('rust-toolchain.toml', 'services/tur-pax/Cargo.lock', 'services/tur-pax-memory/Cargo.lock', 'services/tur-device-manager/Cargo.lock', 'services/tur-storage/Cargo.lock', 'services/tur-catalogue/Cargo.lock', 'services/tur-diagnostics/Cargo.lock', 'services/tur-runtime/Cargo.lock') }}
          restore-keys: pax-

      - name: Build tur-pax and the tool programs it adapts
        run: |
          for component in tur-pax tur-pax-memory tur-device-manager tur-storage tur-catalogue tur-diagnostics tur-runtime; do
            echo "::group::cargo build: $component"
            (cd "services/$component" && cargo build --locked)
            echo "::endgroup::"
          done

      - name: Put the programs, the catalogue and the fixtures in place
        # Where the shipped adapters expect them: /usr/bin and /usr/share.
        # Both are in the read-only system view of the sandbox. The fixtures
        # and the test tool are the test's own.
        run: |
          sudo install -m 0755 services/tur-device-manager/target/debug/tur-device /usr/bin/tur-device
          sudo install -m 0755 services/tur-storage/target/debug/tur-storage /usr/bin/tur-storage
          sudo install -m 0755 services/tur-catalogue/target/debug/tur-catalogue /usr/bin/tur-catalogue
          sudo install -m 0755 services/tur-diagnostics/target/debug/tur-diag /usr/bin/tur-diag
          sudo install -m 0755 services/tur-runtime/target/debug/tur-runtime /usr/bin/tur-runtime
          sudo mkdir -p /usr/share/tur /usr/share/tur-pax-e2e
          sudo cp -r catalogue /usr/share/tur/catalogue
          # Each component's assistant tools, where tur-pax looks for them
          # when it is not told otherwise: one directory for each component,
          # holding its manifest and, beside it, its adapters.
          for component in services/*/; do
            if [ -f "$component/agent-tools.json" ]; then
              name="$(basename "$component")"
              sudo install -D -m 0644 "$component/agent-tools.json" "/usr/share/tur/pax/tools/$name/agent-tools.json"
              sudo install -D -m 0644 "$component/agent-tools.adapter.json" "/usr/share/tur/pax/tools/$name/agent-tools.adapter.json"
            fi
          done
          find /usr/share/tur/pax -type f | sort
          sudo cp -r services/tur-device-manager/tests/fixtures/laptop /usr/share/tur-pax-e2e/laptop
          sudo install -m 0644 tests/pax/probe_sockets.py /usr/share/tur-pax-e2e/probe_sockets.py
          sudo install -m 0755 tests/pax/tur-pax-test-tool /usr/bin/tur-pax-test-tool
          # The runtime directory a desktop session would have.
          uid="$(id -u)"
          sudo mkdir -p "/run/user/$uid"
          sudo chown "$uid" "/run/user/$uid"
          sudo chmod 0700 "/run/user/$uid"
          ls -l /usr/bin/tur-* /usr/share/tur /usr/share/tur-pax-e2e

      - name: End-to-end test
        run: |
          python3 tests/pax/e2e.py \
            --tur-pax services/tur-pax/target/debug/tur-pax \
            --tur-pax-memory services/tur-pax-memory/target/debug/tur-pax-memory \
            --work-dir "$WORK/work" \
            --evidence "$WORK/evidence"

      - name: A user service manager, for the wake timer
        # Optional. With it, the session service sets its own transient
        # timer (systemd-run --user) and the test waits for it to fire.
        # Without it, the test runs what the timer would run, and its
        # summary says so.
        if: success() || failure()
        continue-on-error: true
        run: |
          sudo loginctl enable-linger "$(id -un)"
          uid="$(id -u)"
          for _ in $(seq 1 60); do
            [ -S "/run/user/$uid/systemd/private" ] && break
            sleep 0.5
          done
          if XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user show-environment >/dev/null; then
            echo "user service manager: running" | tee "$WORK/evidence/user-manager.txt"
          else
            echo "user service manager: not available" | tee "$WORK/evidence/user-manager.txt"
          fi

      - name: Session service test
        if: success() || failure()
        run: |
          uid="$(id -u)"
          sudo mkdir -p "/run/user/$uid"
          sudo chown "$uid" "/run/user/$uid"
          sudo chmod 0700 "/run/user/$uid"
          python3 tests/pax/service_e2e.py \
            --tur-pax services/tur-pax/target/debug/tur-pax \
            --work-dir "$WORK/service" \
            --evidence "$WORK/evidence"

      - name: Summary
        if: always()
        run: |
          if [ -f "$WORK/evidence/summary.md" ]; then
            cat "$WORK/evidence/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The end-to-end test did not write a summary." >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$WORK/evidence/service-summary.md" ]; then
            cat "$WORK/evidence/service-summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "The session service test did not write a summary." >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -la "$WORK/evidence" || true

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: pax-evidence
          path: ${{ runner.temp }}/pax-e2e/evidence/
          if-no-files-found: warn
