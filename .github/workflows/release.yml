# SPDX-License-Identifier: LicenseRef-TUR-Noncommercial-1.0.0
#
# Release (ADR-0023; docs/architecture/publishing.md): publish the image CI
# built and tested, as a signed update, to ghcr.io/giorgiogiudice/tur.
#
# 1. await    decides, once and in seconds, whether the commit's image may be
#             released: every other workflow on the commit has finished and
#             passed, and the image was built and booted. It never waits on a
#             runner (issue #114): it runs each time a workflow on main
#             finishes, says "not yet" while others are running, and lets the
#             release go ahead on the event that completes the set.
# 2. release  takes the image the `image` workflow tested (its OCI archive,
#             checked against the image ID that workflow recorded), re-chunks
#             it so that no layer holds what a later one removed, checks every
#             layer for Fedora's marks and the files against the tested image,
#             pushes it to a registry inside the job, signs it there, and proves
#             on a booted TUR guest that it is accepted and started while an
#             unsigned image, one signed with another key and one whose
#             signature is not in the transparency log are refused before
#             anything is staged. Then the same digest, with its signatures, is
#             copied to where it is published and read back.
# 3. promote  (manual, with a build ID) points `stable` at a published build.
#
# What starts it:
#   - workflow_run: a workflow on main has finished. Only a run that a push
#     to main started counts (the job's `if`); the commit is the one that run
#     was for (github.event.workflow_run.head_sha), and that commit's scripts
#     are checked out. This event runs main's copy of this file, in main's
#     context: github.ref is refs/heads/main whatever started the run, so
#     nothing here decides by github.ref alone. A workflow that runs on main
#     and is missing from the list below is still counted, but when it is
#     the last to finish nothing starts the release: start it by hand.
#   - pull_request, only when the pull request changes the release itself:
#     a rehearsal, decided at once. It takes this commit's image if all its
#     workflows have already passed, else the latest image of the branch that
#     was built and booted; with neither, nothing happens (start one by hand
#     with `image_run`). It runs the pull request's copy of this file. A
#     rehearsal from workflow_run was not chosen: it would run main's copy,
#     not the one under review, with the pull request's scripts under main's
#     token.
#   - workflow_dispatch: with `promote`, promotion; with `image_run`, a
#     rehearsal with that run of the image workflow; with neither, the same
#     decision as for main, once, for the commit it is started on.
#
# Publishing is off until the owner sets the repository variable
# TUR_PUBLISH=1 (publishing.md, section 8). Until then, and always on pull
# requests and with `image_run`, the release job runs in full against its own
# registry and its own throwaway keys, and nothing leaves the job.
name: release

on:
  workflow_run:
    workflows: [rust, image, boot, rollback, pax, desktop, windows-runtime, update, apps, iso, local-ai, reports, release-installer, windows-drivers, base-mirror]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "scripts/release/**"
      - "image/signing/**"
      - "image/rootfs/usr/share/tur/signing/**"
      - "image/rootfs/usr/share/containers/**"
  workflow_dispatch:
    inputs:
      promote:
        description: "A published build ID to promote to stable (empty: release this commit to testing)"
        type: string
        required: false
        default: ""
      image_run:
        description: "Rehearse with this run of the image workflow (never publishes)"
        type: string
        required: false
        default: ""

permissions: {}

# One run per commit (workflow_run) or per ref. For a commit of main, a newer
# evaluation replaces an older one; it reads every run again, so nothing is
# lost. A person's promotion is never cancelled. The release job has a group
# of its own (below), so that an evaluation of another commit cannot cancel
# a release in progress.
concurrency:
  group: release-${{ github.event_name }}-${{ github.event.workflow_run.head_sha || github.ref }}-${{ inputs.promote || 'testing' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  PUBLISHED_REPOSITORY: ghcr.io/giorgiogiudice/tur
  COSIGN_VERSION: v3.1.4
  COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
  REGISTRY_IMAGE: docker.io/library/registry:3.1.1@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
  PODMAN: sudo podman
  # The commit whose image is released and whose scripts run: for
  # workflow_run, the commit of the run that finished; empty otherwise (the
  # event's own commit).
  COMMIT: ${{ github.event.workflow_run.head_sha }}

jobs:
  await:
    name: Decide, once, whether this commit's image may be released
    # workflow_run: only for a run that a push to main started, in this
    # repository. A pull request's branch named main is a pull_request run.
    if: >-
      ${{ !inputs.promote && (github.event_name != 'workflow_run' ||
          (github.event.workflow_run.event == 'push' &&
           github.event.workflow_run.head_branch == 'main' &&
           github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      release: ${{ steps.await.outputs.release }}
      reason: ${{ steps.await.outputs.reason }}
      image_run: ${{ steps.await.outputs.image_run }}
      boot_run: ${{ steps.await.outputs.boot_run }}
      rollback_run: ${{ steps.await.outputs.rollback_run }}
      rehearsal: ${{ steps.await.outputs.rehearsal }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      # The rules are those of scripts/release/await.py, whose functions this
      # uses; what differs is that nothing here waits. A run that is not
      # finished means "not yet" (main: the event of the last workflow to
      # finish decides) or "an earlier image of the branch" (pull request).
      - name: Decide
        id: await
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha || github.sha }}
          IMAGE_RUN: ${{ inputs.image_run }}
          HEAD_REF: ${{ github.head_ref }}
          TRIGGER_ID: ${{ github.event.workflow_run.id }}
          TRIGGER_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TRIGGER_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python3 - <<'PY'
          import importlib.util, os, sys, time

          spec = importlib.util.spec_from_file_location("release_await", "scripts/release/await.py")
          rules = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(rules)

          repo, event, sha = os.environ["GITHUB_REPOSITORY"], os.environ["EVENT"], os.environ["SHA"]
          if os.environ.get("IMAGE_RUN"):
              sys.exit(rules.rehearse_with(repo, rules.api(repo, f"/actions/runs/{os.environ['IMAGE_RUN']}"),
                                           "a person asked for it"))
          pull_request = event == "pull_request"
          events = {"pull_request"} if pull_request else {"push", "workflow_dispatch"}
          trigger = None
          if os.environ.get("TRIGGER_ID"):
              trigger = (os.environ["TRIGGER_ID"], os.environ.get("TRIGGER_ATTEMPT") or "1",
                         os.environ["TRIGGER_CONCLUSION"])

          def read():
              chosen = rules.latest(rules.runs_for(repo, sha), events)
              # The run whose end started this evaluation has finished, but
              # the list may not say so yet: its result is in the event, for
              # the attempt the event is about.
              for name, run in chosen.items():
                  if (trigger and run["status"] != "completed" and str(run["id"]) == trigger[0]
                          and str(run.get("run_attempt", 1)) == trigger[1]):
                      chosen[name] = dict(run, status="completed", conclusion=trigger[2])
              return chosen

          def unfinished(chosen):
              return sorted(n for n, r in chosen.items() if r["status"] != "completed")

          def no(reason, code=0):
              rules.output(release="false", reason=reason)
              rules.summary("Not released: " + reason)
              sys.exit(code)

          if pull_request:
              time.sleep(30)  # let the commit's other runs be created
          chosen = read()
          if event == "workflow_run":
              # A run that finished a moment ago can still be listed as
              # running, and the evaluation its own event started may be the
              # one this one replaced: look twice more before believing it.
              for _ in range(2):
                  if not unfinished(chosen):
                      break
                  time.sleep(15)
                  chosen = read()
          pending = unfinished(chosen)
          print(", ".join(f"{n}={r['status'] if r['status'] != 'completed' else r['conclusion']}"
                          for n, r in sorted(chosen.items())) or "no other workflow on this commit", flush=True)

          if event == "workflow_run":
              # As before, when a newer push cancelled the run that waited:
              # only main's newest commit is released.
              tip = rules.api(repo, "/branches/main")["commit"]["sha"]
              if tip != sha:
                  no(f"main has moved on to {tip[:12]}; {sha[:12]} is not released")
          if "image" not in chosen:
              if pull_request:
                  sys.exit(rules.fallback(repo, os.environ["HEAD_REF"], "the image workflow did not run on this commit"))
              no("the image workflow did not run on this commit: no image to release")
          if pending:
              if pull_request:
                  sys.exit(rules.fallback(repo, os.environ["HEAD_REF"],
                                          "this commit's workflows have not finished (" + ", ".join(pending) + ")"))
              no("not yet: still running: " + ", ".join(pending)
                 + (". The release starts when the last of them has finished" if event == "workflow_run"
                    else ". Start this again when they have finished"))

          table = ["| Workflow | Run | Result |", "|---|---|---|"]
          table += [f"| {n} | [{r['id']}]({r['html_url']}) | {r['conclusion']} |" for n, r in sorted(chosen.items())]
          rules.summary("### Workflows on this commit\n\n" + "\n".join(table) + "\n")
          failed = sorted(f"{n} ({r['conclusion']})" for n, r in chosen.items() if r["conclusion"] not in rules.GOOD)
          ids = {f"{n}_run": str(chosen[n]["id"]) if n in chosen else "" for n in ("image", "boot", "rollback")}
          if failed:
              rules.output(release="false", reason="not every workflow passed: " + ", ".join(failed), **ids)
              rules.summary("Not released: " + ", ".join(failed))
              sys.exit(1)
          if chosen["image"]["conclusion"] != "success" or chosen.get("boot", {}).get("conclusion") != "success":
              if pull_request:
                  sys.exit(rules.fallback(repo, os.environ["HEAD_REF"], "the boot workflow did not run on this commit"))
              rules.output(release="false",
                           reason="this commit's image was not both built (image) and booted (boot) by CI", **ids)
              rules.summary("Nothing to release: the image of this commit was not both built and booted by CI.")
              sys.exit(0)
          rules.output(release="true", rehearsal="false", reason="every workflow on this commit passed", **ids)
          PY

  # On a pull request, always (it is the check of the scripts under review);
  # otherwise only when there is something to release, so that an evaluation
  # that says "not yet" takes one short job and no more.
  lint:
    name: Lint the release scripts
    needs: await
    if: ${{ !cancelled() && !inputs.promote && needs.await.result != 'skipped' && (github.event_name == 'pull_request' || needs.await.outputs.release == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false
      - name: Lint
        run: |
          shellcheck -x scripts/release/*.sh tests/boot/guest/rootfs/usr/libexec/tur-boot-test/signed-update-agent \
            tests/boot/guest/rootfs/usr/libexec/tur-boot-test/guest-agent
          python3 -m py_compile scripts/release/*.py tests/boot/signed-update.py tests/image/marks.py image/signing/policy.py
          python3 scripts/release/compare-trees.py --self-test
          python3 tests/image/marks.py --self-test

  release:
    name: Re-chunk, sign, prove on a booted guest, publish
    needs: [lint, await]
    if: ${{ needs.await.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    # One release at a time per branch or ref: on main, a newer commit's
    # release replaces an older one still in progress, as a newer push did
    # before. Evaluations are not in this group and cancel nothing here.
    concurrency:
      group: release-job-${{ github.event_name }}-${{ github.event.workflow_run.head_branch || github.ref }}
      cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
    permissions:
      contents: read
      actions: read     # the artifacts of the image, boot and rollback runs
      id-token: write   # keyless signing with this workflow's own identity
      packages: write   # pushing to ghcr.io, only with TUR_PUBLISH=1
    env:
      # Publishing: only with TUR_PUBLISH=1, never for a rehearsal, and only
      # for main: a run that a push to main started (workflow_run: github.ref
      # is main for every such event, so the run that finished is asked what
      # it was), or a run started by hand on main. Never on a pull request.
      PUBLISH: ${{ vars.TUR_PUBLISH == '1' && needs.await.outputs.rehearsal != 'true' && ((github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')) && '1' || '0' }}
      OUT: out/release
      LOCAL: localhost:5000/tur
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.COMMIT }}
          persist-credentials: false

      # The pinned base, for the marks check (fedora-logos' checksums come
      # from it): from TUR's mirror once quay.io has dropped the digest.
      - uses: ./.github/actions/use-base-mirror

      - name: Mode
        run: |
          mkdir -p "$OUT"
          if [ "$PUBLISH" = 1 ]; then
            echo "Publishing is ON: the image goes to $PUBLISHED_REPOSITORY." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Publishing is off (TUR_PUBLISH is not 1, or this is not main): a rehearsal; nothing leaves this job." | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "podman: $(podman --version); skopeo: $(skopeo --version); kernel: $(uname -r)"
          df -h / | tail -1

      - name: Before publishing, the release key must exist
        if: ${{ env.PUBLISH == '1' }}
        env:
          HAVE_KEY: ${{ secrets.TUR_RELEASE_SIGNING_KEY != '' }}
        run: |
          test "$HAVE_KEY" = true || { echo "the secret TUR_RELEASE_SIGNING_KEY is missing (publishing.md, section 8)"; exit 1; }
          test -s image/rootfs/usr/share/tur/signing/release.pub \
            || { echo "image/rootfs/usr/share/tur/signing/release.pub is missing: computers would refuse every update"; exit 1; }

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Choose a work directory
        run: |
          work="$RUNNER_TEMP/tur-release"
          mkdir -p "$work"
          echo "WORK=$work" >> "$GITHUB_ENV"

      # Hosted runners expose /dev/kvm but not to the runner user (see boot.yml).
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          python3 tests/boot/check-kvm.py "$OUT/kvm.json"

      - name: Install cosign, QEMU and UEFI firmware
        run: |
          curl -sSfL -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/cosign" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/cosign" /usr/local/bin/cosign
          cosign version 2>&1 | grep GitVersion
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf zstd
          qemu-system-x86_64 --version | head -1

      # ---- the image CI tested ------------------------------------------------------
      - name: Download the tested image (image workflow)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tur-image-oci
          path: ${{ env.WORK }}/tested
          run-id: ${{ needs.await.outputs.image_run }}
          github-token: ${{ github.token }}
      - name: Download its build manifest and SBOM (image workflow)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tur-image-metadata
          path: ${{ env.WORK }}/metadata
          run-id: ${{ needs.await.outputs.image_run }}
          github-token: ${{ github.token }}
      - name: Download what the boot test recorded (boot workflow)
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: tur-boot-test
          path: ${{ env.WORK }}/boot
          run-id: ${{ needs.await.outputs.boot_run }}
          github-token: ${{ github.token }}
      - name: Download what the rollback scenarios recorded (rollback workflow)
        if: ${{ needs.await.outputs.rollback_run != '' }}
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: tur-rollback-*
          path: ${{ env.WORK }}/rollback
          run-id: ${{ needs.await.outputs.rollback_run }}
          github-token: ${{ github.token }}

      - name: The tested image, checked by its image ID
        run: |
          others=(--boot "$WORK/boot")
          if [ -d "$WORK/rollback" ]; then others+=(--rollback "$WORK/rollback"); fi
          python3 scripts/release/tested.py "$WORK/tested" "$OUT/tested.json" "${others[@]}"
          id=$(cat "$WORK/tested/image-id")
          sudo skopeo copy --quiet "oci-archive:$WORK/tested/tur-image.oci.tar" containers-storage:localhost/tur:tested
          loaded=$($PODMAN image inspect -f '{{.Id}}' localhost/tur:tested)
          echo "loaded: $loaded"
          test "$loaded" = "$id"
          echo "IMAGE_ID=$id" >> "$GITHUB_ENV"
          echo "BUILD_ID=$(cat "$WORK/tested/build-id")" >> "$GITHUB_ENV"

      - name: The trust roots the image carries are Sigstore's
        run: |
          cosign initialize > /dev/null
          python3 scripts/release/trust-roots.py "$(find ~/.sigstore -name trusted_root.json | head -1)" \
            --check image/rootfs/usr/share/tur/signing

      # ---- re-chunk -------------------------------------------------------------------
      - name: Log in to the published repository
        if: ${{ env.PUBLISH == '1' }}
        env:
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Re-chunk
        id: rechunk
        run: |
          set -o pipefail
          previous=""
          if [ "$PUBLISH" = 1 ] && skopeo inspect --raw "docker://$PUBLISHED_REPOSITORY:testing" > /dev/null 2>&1; then
            previous="docker://$PUBLISHED_REPOSITORY:testing"
            export REGISTRY_AUTH_FILE="$HOME/.docker/config.json"
          fi
          scripts/release/rechunk.sh localhost/tur:tested "$WORK/tested/tur-image.oci.tar" "$IMAGE_ID" \
            "$WORK" "$WORK/published" $previous | tee "$OUT/rechunk.txt"
          echo "DIGEST=$(cat "$WORK/published.digest")" >> "$GITHUB_ENV"
          sudo skopeo copy --quiet "oci:$WORK/published:latest" containers-storage:localhost/tur:published
          rm -f "$WORK/tested/tur-image.oci.tar"

      - name: The re-chunked image holds the same files as the tested one
        id: trees
        if: ${{ !cancelled() && steps.rechunk.outcome == 'success' }}
        run: sudo python3 scripts/release/compare-trees.py localhost/tur:tested localhost/tur:published "$OUT/trees.json"

      - name: Fedora's marks, in the image and in every layer of it
        id: marks
        if: ${{ !cancelled() && steps.rechunk.outcome == 'success' }}
        run: |
          status=0
          python3 tests/image/marks.py localhost/tur:published "$OUT/marks" --layers "$WORK/published:latest" || status=$?
          cat "$OUT/marks/marks.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"

      - name: Smoke tests of the re-chunked image
        id: smoke
        if: ${{ !cancelled() && steps.rechunk.outcome == 'success' }}
        run: tests/image/smoke.sh localhost/tur:published "$BUILD_ID"

      # ---- a registry in this job, the image signed in it ------------------------------
      - name: Push to a registry inside the job
        id: push
        if: ${{ !cancelled() && steps.rechunk.outcome == 'success' }}
        run: |
          mkdir -p "$WORK/registry"
          docker run -d --name tur-registry -p 5000:5000 -v "$WORK/registry:/var/lib/registry" "$REGISTRY_IMAGE"
          for _ in $(seq 30); do curl -sf http://localhost:5000/v2/ > /dev/null && break; sleep 1; done
          skopeo copy --quiet --preserve-digests --dest-tls-verify=false \
            "oci:$WORK/published:latest" "docker://$LOCAL:$BUILD_ID"
          pushed=$(skopeo inspect --raw --tls-verify=false "docker://$LOCAL:$BUILD_ID" | sha256sum | cut -d' ' -f1)
          echo "re-chunked: $DIGEST"; echo "pushed:     sha256:$pushed"
          test "sha256:$pushed" = "$DIGEST"
          # The refusal fixtures: the same layers, another digest each.
          python3 scripts/release/variant.py "$WORK/published" latest unsigned other-key no-log | tee "$WORK/variants.env"
          variants=""
          while IFS='=' read -r name digest; do
            skopeo copy --quiet --preserve-digests --dest-tls-verify=false \
              "oci:$WORK/published:$name" "docker://$LOCAL:test-$name"
            variants="$variants $name=$digest"
          done < "$WORK/variants.env"
          echo "VARIANTS=${variants# }" >> "$GITHUB_ENV"

      - name: Sign
        id: sign
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        env:
          TUR_RELEASE_KEY: ${{ env.PUBLISH == '1' && secrets.TUR_RELEASE_SIGNING_KEY || '' }}
          COSIGN_PASSWORD: ${{ env.PUBLISH == '1' && secrets.TUR_RELEASE_SIGNING_PASSWORD || '' }}
        run: |
          keys="$WORK/keys"
          mkdir -p "$keys"
          ( cd "$keys" && COSIGN_PASSWORD="" cosign generate-key-pair --output-key-prefix other > /dev/null )
          if [ "$PUBLISH" = 1 ]; then
            key=env://TUR_RELEASE_KEY
            pub=image/rootfs/usr/share/tur/signing/release.pub
            cosign public-key --key env://TUR_RELEASE_KEY > "$keys/from-secret.pub"
            cmp "$keys/from-secret.pub" "$pub" \
              || { echo "the secret key is not the one whose public half the image carries"; exit 1; }
          else
            # A throwaway key in place of the release key, which does not exist
            # while publishing is off. The guest is given its public half.
            ( cd "$keys" && COSIGN_PASSWORD="" cosign generate-key-pair --output-key-prefix release > /dev/null )
            key="$keys/release.key"
            pub="$keys/release.pub"
            export COSIGN_PASSWORD=""
          fi
          echo "RELEASE_PUB=$pub" >> "$GITHUB_ENV"
          TUR_BUILD_MANIFEST="$WORK/metadata/build-manifest.json" TUR_SBOM="$WORK/metadata/sbom.spdx.json" \
          TUR_TEST_VARIANTS="$VARIANTS" TUR_OTHER_KEY="$keys/other.key" \
            scripts/release/sign.sh "$LOCAL" "$DIGEST" "$key" "$pub" "$OUT/signing"

      # ---- the proof on a booted guest ---------------------------------------------------
      - name: Install the tested image to a disk, with the boot test's agent
        id: disk
        if: ${{ !cancelled() && steps.rechunk.outcome == 'success' }}
        run: |
          python3 image/signing/policy.py --print > "$WORK/policy-rule.json"
          tests/boot/build-disk.sh localhost/tur:tested "$WORK" "$OUT/prepare"

      - name: Prepare the disk (the boot test's first two boots)
        id: prepare
        if: ${{ !cancelled() && steps.disk.outcome == 'success' }}
        run: python3 tests/boot/run-vm.py --disk "$WORK/disk.raw" --work "$WORK" --out "$OUT/prepare" --timeout 900 --prepare-only

      - name: Signed update in a booted guest
        id: guest
        if: ${{ !cancelled() && steps.prepare.outcome == 'success' && steps.sign.outcome == 'success' }}
        run: |
          cases=()
          for pair in $VARIANTS; do cases+=(--case "${pair%%=*}=test-${pair%%=*}"); done
          key=()
          if [ "$PUBLISH" != 1 ]; then key=(--test-key "$RELEASE_PUB"); fi
          python3 tests/boot/signed-update.py --disk "$WORK/disk.raw" --work "$WORK" --out "$OUT/signed-update" \
            --registry 10.0.2.2:5000/tur --digest "$DIGEST" --signed "$BUILD_ID" "${cases[@]}" "${key[@]}" \
            --policy-rule "$WORK/policy-rule.json" --timeout 3600

      # ---- publishing ----------------------------------------------------------------------
      # Always rehearsed against a second repository of the job's registry: the
      # same script, the same checks, the same promotion.
      - name: Rehearse publishing and promotion
        id: rehearse
        if: ${{ !cancelled() && steps.sign.outcome == 'success' }}
        run: |
          rehearsal=localhost:5000/tur-rehearsal
          scripts/release/publish.sh "$LOCAL" "$DIGEST" "$rehearsal" "$BUILD_ID" testing
          scripts/release/publish.sh "$LOCAL" "$DIGEST" "$rehearsal" "$BUILD_ID" testing
          scripts/release/publish.sh "$rehearsal" "$DIGEST" "$rehearsal" "$BUILD_ID" stable
          cosign verify --allow-http-registry --key "$RELEASE_PUB" "$rehearsal:stable" > /dev/null
          cosign verify --allow-http-registry --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$rehearsal:stable" > /dev/null
          echo "the rehearsal repository's stable names $DIGEST, with both signatures"

      - name: Publish to testing
        if: ${{ success() && env.PUBLISH == '1' }}
        run: |
          scripts/release/publish.sh "$LOCAL" "$DIGEST" "$PUBLISHED_REPOSITORY" "$BUILD_ID" testing
          cosign verify --key "$RELEASE_PUB" "$PUBLISHED_REPOSITORY@$DIGEST" > /dev/null
          cosign verify --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$PUBLISHED_REPOSITORY@$DIGEST" > /dev/null
          echo "Published: \`$PUBLISHED_REPOSITORY:$BUILD_ID\` = \`$DIGEST\`, and \`testing\`." | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: always()
        run: |
          {
            echo "### Release of ${BUILD_ID:-?}"
            echo
            echo "- tested image: \`sha256:${IMAGE_ID:-?}\` (image workflow run ${{ needs.await.outputs.image_run }})"
            echo "- published digest: \`${DIGEST:-not made}\`"
            echo "- publishing: $([ "$PUBLISH" = 1 ] && echo "on, to $PUBLISHED_REPOSITORY" || echo "off (rehearsal)")"
            echo
            if [ -f "$OUT/signed-update/summary.md" ]; then cat "$OUT/signed-update/summary.md"; fi
            if [ -f "$OUT/signing/signing.env" ]; then echo; echo '```'; cat "$OUT/signing/signing.env"; echo '```'; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnostics on failure
        if: failure()
        run: |
          show() { echo "::group::$1"; if [ -f "$1" ]; then tail -n "${2:-200}" "$1"; else echo "(absent)"; fi; echo "::endgroup::"; }
          show "$OUT/prepare/host/vm-result.json"
          show "$OUT/signed-update/guest/stage/status"
          show "$OUT/signed-update/guest/new-version/status"
          for f in "$OUT"/signed-update/guest/stage/switch-*.txt; do show "$f" 40; done
          df -h /

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: tur-release
          path: out/release/
          if-no-files-found: warn

  promote:
    name: Promote a published build to stable
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.promote != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write   # moving the stable tag
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Promote
        env:
          BUILD_ID: ${{ inputs.promote }}
          TUR_PUBLISH: ${{ vars.TUR_PUBLISH }}
          TOKEN: ${{ github.token }}
        run: |
          test "$TUR_PUBLISH" = 1 || { echo "publishing is off (TUR_PUBLISH is not 1): nothing to promote"; exit 1; }
          test "$GITHUB_REF" = refs/heads/main || { echo "promote from main only"; exit 1; }
          [[ "$BUILD_ID" =~ ^[0-9]{8}\.g[0-9a-f]{12}$ ]] || { echo "not a build ID: $BUILD_ID"; exit 1; }
          curl -sSfL -o "$RUNNER_TEMP/cosign" \
            "https://github.com/sigstore/cosign/releases/download/${COSIGN_VERSION}/cosign-linux-amd64"
          echo "${COSIGN_SHA256}  $RUNNER_TEMP/cosign" | sha256sum -c -
          sudo install -m 0755 "$RUNNER_TEMP/cosign" /usr/local/bin/cosign
          printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest="sha256:$(skopeo inspect --raw "docker://$PUBLISHED_REPOSITORY:$BUILD_ID" | sha256sum | cut -d' ' -f1)"
          echo "$PUBLISHED_REPOSITORY:$BUILD_ID is $digest"
          # Only what TUR's release workflow on main signed, with both signatures.
          cosign verify --key image/rootfs/usr/share/tur/signing/release.pub "$PUBLISHED_REPOSITORY@$digest" > /dev/null
          cosign verify --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/heads/main" \
            "$PUBLISHED_REPOSITORY@$digest" > /dev/null
          scripts/release/publish.sh "$PUBLISHED_REPOSITORY" "$digest" "$PUBLISHED_REPOSITORY" "$BUILD_ID" stable
          echo "\`stable\` now names \`$PUBLISHED_REPOSITORY:$BUILD_ID\` = \`$digest\` (promoted by ${{ github.actor }})." \
            | tee -a "$GITHUB_STEP_SUMMARY"
