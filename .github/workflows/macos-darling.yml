#
# The macOS route's integration test (docs/reports/macos-darling-1.md;
# tests/macos-darling/integration.py): tur-runtime, built here, imports TUR's
# build of Darling from a darling-runtime run, installs open-source Mac
# applications built from source by the macfw experiment's oracle on
# GitHub's Mac (reused from an exp-macfw run: this workflow has no macOS job),
# starts them under Xvfb in Darling inside tur-runtime's sandbox, looks for a
# window and drives the one TUR wrote, and removes them again. It also checks
# the refusals: SwiftUI and Swift programs, arm64-only programs.
#
# Started by hand only (workflow_dispatch). It runs in a container of the OS
# image's pinned base, because TUR's Darling links against that base's
# libraries. Green means the harness ran and wrote its results; what worked
# is in results.json and the summary, and a failed application is a finding.
name: macos-darling

on:
  workflow_dispatch:
    inputs:
      runtime_run:
        description: "darling-runtime run whose darling-runtime artifact is used"
        required: true
      macfw_run:
        description: "exp-macfw run whose macfw-oracle artifact holds the built applications"
        required: true
      apps:
        description: "Bundles of the oracle's apps/ to install and start, comma-separated"
        required: false
        default: "rung1-hello.app,Table Tool.app"
      modes:
        description: "Darling modes to try, comma-separated: nonroot, rootless"
        required: false
        default: "nonroot,rootless"
      strict:
        description: "Fail the job when an expectation is not met (tests/macos-darling/expected.json)"
        type: boolean
        default: false
  # darling-update runs it on a candidate build, strictly, before it
  # proposes the candidate for the image.
  workflow_call:
    inputs:
      runtime_run:
        type: string
        required: true
      macfw_run:
        type: string
        required: true
      apps:
        type: string
        default: "rung1-hello.app,Table Tool.app"
      modes:
        type: string
        default: "nonroot"
      strict:
        type: boolean
        default: true

permissions:
  contents: read
  actions: read    # artifacts of the two earlier runs
  packages: read   # the pinned base from TUR's mirror (ghcr.io)

concurrency:
  group: macos-darling-${{ github.event_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  integration:
    name: Install, start and remove Mac applications in Darling
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            services/tur-runtime/target
          key: macos-darling-${{ hashFiles('rust-toolchain.toml', 'services/tur-runtime/Cargo.lock') }}
          restore-keys: macos-darling-

      - name: Build tur-runtime
        working-directory: services/tur-runtime
        run: cargo build --release --locked

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: darling-runtime
          path: ${{ runner.temp }}/darling
          run-id: ${{ inputs.runtime_run }}
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: macfw-oracle
          path: ${{ runner.temp }}/oracle
          run-id: ${{ inputs.macfw_run }}
          github-token: ${{ github.token }}

      - uses: ./.github/actions/use-base-mirror

      - name: Run the integration test
        env:
          APPS: ${{ inputs.apps }}
          MODES: ${{ inputs.modes }}
          STRICT: ${{ inputs.strict && '1' || '0' }}
        run: |
          tests/macos-darling/ci-run.sh \
            "services/tur-runtime/target/release/tur-runtime" \
            "$RUNNER_TEMP/darling" "$RUNNER_TEMP/oracle" "$RUNNER_TEMP/results"

      - name: Summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/results/summary.md" ]; then
            cat "$RUNNER_TEMP/results/summary.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No results: the harness did not run to the end." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: macos-darling-results
          path: ${{ runner.temp }}/results
          retention-days: 30
