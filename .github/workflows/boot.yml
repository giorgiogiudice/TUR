# SPDX-License-Identifier: LicenseRef-TUR-Noncommercial-1.0.0
#
# Boot test (TUR-003): install the image to a disk with the installer it
# carries, boot that disk under UEFI in QEMU/KVM, and prove from outside that
# it reaches a graphical session. See tests/boot and docs/reports/TUR-003.md.
name: boot

on:
  push:
    branches: [main]
    paths:
      - "image/**"
      # TUR's artwork: the boot splash, the logo and the wallpaper the
      # screenshots show.
      - "branding/**"
      # Programs compiled into the image (image/programs.tsv), what they are
      # compiled with, and what is installed beside them. Each is run on the
      # booted system, the P@x end-to-end test among them.
      - "services/tur-ai-local/**"
      - "services/tur-apps/**"
      - "services/tur-boot-health/**"
      - "services/tur-catalogue/**"
      - "services/tur-device-manager/**"
      - "services/tur-diagnostics/**"
      - "services/tur-pax/**"
      - "services/tur-pax-memory/**"
      - "services/tur-pax-providers/**"
      - "services/tur-runtime/**"
      - "services/tur-storage/**"
      - "services/tur-update/**"
      - "installer/tur-installer-core/**"
      - "catalogue/**"
      - "tests/pax/**"
      - "crates/**"
      - "rust-toolchain.toml"
      - "tests/boot/**"
      - "scripts/build-image.sh"
      - "VERSION"
      - ".github/workflows/boot.yml"
  pull_request:
    paths:
      - "image/**"
      # TUR's artwork: the boot splash, the logo and the wallpaper the
      # screenshots show.
      - "branding/**"
      # Programs compiled into the image (image/programs.tsv), what they are
      # compiled with, and what is installed beside them. Each is run on the
      # booted system, the P@x end-to-end test among them.
      - "services/tur-ai-local/**"
      - "services/tur-apps/**"
      - "services/tur-boot-health/**"
      - "services/tur-catalogue/**"
      - "services/tur-device-manager/**"
      - "services/tur-diagnostics/**"
      - "services/tur-pax/**"
      - "services/tur-pax-memory/**"
      - "services/tur-pax-providers/**"
      - "services/tur-runtime/**"
      - "services/tur-storage/**"
      - "services/tur-update/**"
      - "installer/tur-installer-core/**"
      - "catalogue/**"
      - "tests/pax/**"
      - "crates/**"
      - "rust-toolchain.toml"
      - "tests/boot/**"
      - "scripts/build-image.sh"
      - "VERSION"
      - ".github/workflows/boot.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boot-${{ github.ref }}
  cancel-in-progress: true

env:
  PODMAN: sudo podman
  IMAGE: localhost/tur:ci
  OUT: out/boot

jobs:
  lint:
    name: Lint boot test scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lint
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -x tests/boot/*.sh tests/boot/guest/rootfs/usr/libexec/tur-boot-test/guest-agent \
            tests/boot/guest/rootfs/usr/libexec/tur-boot-test/scenario-agent \
            tests/boot/guest/rootfs/usr/libexec/tur-boot-test/component-checks
          python3 -m py_compile tests/boot/*.py
          python3 - <<'EOF'
          import ast
          path = "tests/boot/guest/rootfs/usr/libexec/tur-boot-test/make-pe-fixture"
          ast.parse(open(path).read(), path)
          EOF

  boot:
    name: Install to disk and boot under UEFI in QEMU/KVM
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: ./.github/actions/use-base-mirror

      - name: Runner environment
        run: |
          echo "podman: $(podman --version)"
          echo "kernel: $(uname -r)"
          echo "cpus:   $(nproc) ($(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2 | xargs))"
          free -g | sed -n 2p
          df -h / /mnt 2>/dev/null || df -h /
          sudo podman info --format 'podman storage: driver={{.Store.GraphDriverName}} root={{.Store.GraphRoot}}' || true
          mkdir -p "$OUT/host"

      # Hosted runners expose /dev/kvm but not to the runner user. The udev rule
      # is the method GitHub documents:
      # https://github.blog/changelog/2024-04-02-github-actions-hardware-accelerated-android-virtualization-now-available/
      - name: Enable KVM for the runner user
        run: |
          ls -la /dev/kvm || echo "/dev/kvm is absent"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          ls -la /dev/kvm

      # No software-emulation fallback (ADR-0002): without KVM the job stops here.
      - name: Verify KVM
        run: python3 tests/boot/check-kvm.py "$OUT/host/kvm.json"

      # The image, the boot-test layer and the disk need about 15 GB. Removing the
      # preinstalled toolchains takes two minutes, so do it only when space is short.
      - name: Free disk space if needed
        run: |
          free=$(df --output=avail -B1G / | tail -1 | tr -d ' G')
          echo "free on /: ${free} GiB"
          if [ "$free" -lt 40 ]; then
            sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL
          fi
          df -h / /mnt 2>/dev/null || df -h /

      - name: Choose a work directory
        run: |
          work="$RUNNER_TEMP/tur-boot"
          here=$(df --output=avail -B1G "$RUNNER_TEMP" | tail -1 | tr -d ' G')
          if [ -d /mnt ]; then
            there=$(df --output=avail -B1G /mnt | tail -1 | tr -d ' G')
            if [ "$there" -gt "$here" ]; then
              sudo mkdir -p /mnt/tur-boot
              sudo chown "$(id -u):$(id -g)" /mnt/tur-boot
              work=/mnt/tur-boot
            fi
          fi
          mkdir -p "$work"
          echo "work directory: $work ($(df --output=avail -h "$work" | tail -1 | xargs) free)"
          echo "WORK=$work" >> "$GITHUB_ENV"

      - name: Install QEMU and UEFI firmware
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf
          qemu-system-x86_64 --version | head -1
          dpkg-query -W -f='${Package} ${Version}\n' qemu-system-x86 ovmf seabios
          ls -la /usr/share/OVMF/ | tee "$OUT/host/ovmf-files.txt"

      - name: Build image
        run: |
          start=$(date +%s)
          # The ignore file is named explicitly here; the image workflow builds
          # without the flag and so shows whether podman finds it by itself.
          TUR_BUILD_ID_FILE="$RUNNER_TEMP/build-id" scripts/build-image.sh "$IMAGE" \
            --ignorefile image/Containerfile.containerignore
          echo "BUILD_ID=$(cat "$RUNNER_TEMP/build-id")" >> "$GITHUB_ENV"
          echo "IMAGE_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          df -h / | tail -1

      - name: Build the boot-test image and install it to a disk
        run: |
          start=$(date +%s)
          tests/boot/build-disk.sh "$IMAGE" "$WORK" "$OUT"
          echo "DISK_BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          df -h / "$WORK"

      - name: Inspect the installed disk
        run: sudo python3 tests/boot/inspect-disk.py installed "$WORK/disk.raw" "$OUT"

      - name: Boot under UEFI in QEMU/KVM
        id: boot
        # Three boots: as installed, after first-run setup, and one with GRUB's
        # boot counter set by hand (ADR-0014, step 2 of the design's brief). The
        # third waits about three minutes for the automount behind /boot to expire.
        # In the second, TUR's own programs are run as an ordinary user, the
        # P@x end-to-end test among them (docs/reports/TUR-006.md), P@x's
        # session service test, and P@x through local AI with a real model on
        # the engine the image carries. The guest has 10 GiB: tur-ai-local
        # serves a model only when its need and a reserve of 1 GiB fit in the
        # memory free at that moment (TUR-AI-LOCAL-006 otherwise): Qwen3 0.6B
        # needs 2.15 GB, Qwen3 4B 6.15 GB, and with 8 GiB 7.05 GB was free
        # (run 43487318802). What was free is recorded; the report requires
        # an answer from a local model here (--require-local-answer) and,
        # for each model, the result its verdict on this machine calls for.
        run: python3 tests/boot/run-vm.py --disk "$WORK/disk.raw" --work "$WORK" --out "$OUT" --timeout 4800 --memory 10240

      - name: Recover the journal from the disk
        if: always()
        run: |
          if [ -f "$WORK/disk.raw" ]; then
            sudo python3 tests/boot/inspect-disk.py postmortem "$WORK/disk.raw" "$OUT"
          else
            echo "no disk image was produced"
          fi

      - name: Boot report
        if: always()
        run: |
          python3 tests/boot/report.py --work "${WORK:-$RUNNER_TEMP}" --out "$OUT" --require-local-answer \
            --expected-build-id "${BUILD_ID:-}" \
            --expected-failed-units tests/boot/expected-failed-units.txt \
            --timing "image_build_seconds=${IMAGE_BUILD_SECONDS:-}" \
            --timing "test_image_and_disk_seconds=${DISK_BUILD_SECONDS:-}"

      - name: Summary
        if: always()
        run: |
          if [ -f "$OUT/summary.md" ]; then cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi

      # TUR-008: one more boot of the tested disk, after everything above has
      # read it, to see the boot splash (the test's own boots show text) and
      # the desktop of a signed-in user. Then the text on every screenshot is
      # read: none may name Fedora (desktop-experience.md, 12.5).
      - name: Boot splash and first desktop (an extra boot of the tested disk)
        id: splash
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: |
          sudo python3 tests/boot/splash.py prepare "$WORK/disk.raw" "$WORK"
          python3 tests/boot/splash.py boot "$WORK" "$OUT" --seconds 200

      - name: No screenshot names Fedora
        if: ${{ !cancelled() && steps.boot.outcome == 'success' }}
        run: |
          sudo apt-get install -y --no-install-recommends tesseract-ocr > /dev/null
          tesseract --version | head -1
          python3 tests/boot/screenshot-text.py "$OUT"

      - name: Diagnostics on failure
        if: failure()
        run: |
          show() { echo "::group::$1"; if [ -f "$1" ]; then tail -n "${2:-200}" "$1"; else echo "(absent)"; fi; echo "::endgroup::"; }
          show "$OUT/host/vm-result.json"
          show "$OUT/boot-state-disk.txt"
          for boot in first-boot second-boot third-boot; do
            show "$OUT/guest/$boot/cmdline-early.txt"
            show "$OUT/guest/$boot/grubenv-early.txt"
            show "$OUT/guest/$boot/grubenv-armed.txt"
            show "$OUT/guest/$boot/status"
            show "$OUT/guest/$boot/failed-units-status.txt"
            show "$OUT/guest/$boot/dm-status.txt"
            show "$OUT/guest/$boot/sessions.txt"
            show "$OUT/guest/$boot/session-processes.txt"
            show "$OUT/guest/$boot/session-journal.txt" 80
            show "$OUT/guest/$boot/prepare-second-boot.txt"
            show "$OUT/guest/$boot/exit-status.tsv"
          done
          show "$OUT/guest/second-boot/components-session.txt"
          show "$OUT/guest/second-boot/components/status"
          show "$OUT/guest/second-boot/components/exit-status.tsv"
          show "$OUT/guest/second-boot/components/pax-e2e.out" 120
          show "$OUT/guest/second-boot/components/pax-e2e.err" 40
          show "$OUT/guest/second-boot/components-avc.txt" 60
          show "$OUT/host/qemu.log"
          echo "::group::serial console, last 150 lines"
          if [ -f "$OUT/serial.log" ]; then
            sed 's/\x1b\[[0-9;?]*[A-Za-z]//g; s/\r//g' "$OUT/serial.log" | tail -n 150
          fi
          echo "::endgroup::"
          ls -laR "$OUT" | head -150

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: tur-boot-test
          path: out/boot/
          if-no-files-found: warn
