# SPDX-License-Identifier: LicenseRef-TUR-Noncommercial-1.0.0
#
# Desktop (D-01, D-02, D-04, D-15, D-17): the licence boundary, the settings
# registries, the build and tests of the Qt programs under desktop/, their
# screenshots, the tests that run them under a real KWin, and P@x's window
# against the real P@x session service.
# Nothing under desktop/ is ever compiled or run anywhere else. See
# desktop/README.md, docs/architecture/desktop-kit.md and
# docs/architecture/desktop-experience.md, section 15.3.
name: desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "installer/gui/**"
      - "schemas/settings-registry.schema.json"
      - ".github/workflows/desktop.yml"
      # P@x's window is tested against the real service (pax-ui-end-to-end)
      # and its fixture is checked against what the service says.
      - "services/tur-pax/**"
      - "tests/pax/**"
  pull_request:
    paths:
      - "desktop/**"
      - "installer/gui/**"
      - "schemas/settings-registry.schema.json"
      - ".github/workflows/desktop.yml"
      # P@x's window is tested against the real service (pax-ui-end-to-end)
      # and its fixture is checked against what the service says.
      - "services/tur-pax/**"
      - "tests/pax/**"
  schedule:
    # Weekly, on the default branch. An Actions cache that is not used for a
    # week is dropped, and with it the builder image the reference images
    # were made with; this keeps it, and shows drift in Fedora's packages.
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILDER: localhost/tur-desktop-builder:ci
  BUILDER_DIR: builder-image
  OUT: out/desktop

jobs:
  boundary:
    name: Licence boundary and tokens
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lint scripts
        run: |
          shellcheck --version | sed -n 2p
          shellcheck -x --severity=warning desktop/ci/*.sh
          python3 --version
          python3 -m py_compile desktop/ci/*.py desktop/kit/tokens/gen_tokens.py desktop/kit/pax/gen_commands.py \
            desktop/data/gen_theme.py
          sudo apt-get install -y --no-install-recommends python3-jsonschema >/dev/null

      - name: The check catches what it should
        run: python3 desktop/ci/boundary.py --self-test

      - name: Licence boundary
        run: python3 desktop/ci/boundary.py

      - name: Tokens and the contrast table
        run: python3 desktop/kit/tokens/gen_tokens.py --check --table

      # TUR's KDE colour schemes, global themes and defaults for new accounts
      # (desktop/data, task D-04): generated from the tokens and not edited
      # since; no gold outside P@x; WCAG AA for every text role in both
      # schemes; the formats Plasma 6.8 reads; the install manifest.
      - name: Theme and defaults, generated and checked
        run: |
          python3 desktop/data/gen_theme.py --self-test
          python3 desktop/data/gen_theme.py --check
          {
            echo "### TUR's colour schemes: roles and contrast"
            echo
            python3 desktop/data/gen_theme.py --table
          } >> "$GITHUB_STEP_SUMMARY"

      # P@x's keyboard commands: one source for the keys the indicator shows
      # and the keys that are bound (desktop-experience.md, 17.1, answer 2).
      - name: P@x's keys, shown and bound, from one source
        run: |
          python3 desktop/kit/pax/gen_commands.py --self-test
          python3 desktop/kit/pax/gen_commands.py --check

      - name: The registry check catches what it should
        run: python3 desktop/ci/registry.py --self-test

      # Every settings registry follows schemas/settings-registry.schema.json,
      # and no address that the main branch has was dropped: an address keeps
      # its meaning for ever (design, 10.3).
      - name: Settings registries
        run: |
          git fetch --no-tags --depth=1 origin main
          python3 desktop/ci/registry.py --against FETCH_HEAD

  builder:
    name: Builder image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Cache key
        id: key
        run: |
          key="desktop-builder-${{ hashFiles('desktop/ci/builder/Containerfile', 'desktop/ci/builder.lock') }}"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "$key"

      - name: Look for the image in the cache
        id: cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BUILDER_DIR }}
          key: ${{ steps.key.outputs.key }}
          lookup-only: true

      - name: Build the image
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "docker: $(docker --version)"
          df -h / | tail -1
          desktop/ci/build-builder.sh "$BUILDER_DIR"
          {
            echo "### Builder image built"
            echo
            echo "Cache key \`${{ steps.key.outputs.key }}\`. $(wc -l < "$BUILDER_DIR/packages.tsv") packages,"
            echo "$(du -h "$BUILDER_DIR/image.tar.zst" | cut -f1) compressed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Put the image in the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BUILDER_DIR }}
          key: ${{ steps.key.outputs.key }}

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always() && steps.cache.outputs.cache-hit != 'true'
        with:
          name: desktop-builder
          path: ${{ env.BUILDER_DIR }}/packages.tsv
          if-no-files-found: warn

  build-test:
    name: Build, lint and test
    needs: builder
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch the builder image
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BUILDER_DIR }}
          key: ${{ needs.builder.outputs.key }}
          fail-on-cache-miss: true

      - name: Load the builder image
        run: desktop/ci/load-builder.sh "$BUILDER_DIR"

      - name: Versions
        run: |
          mkdir -p "$OUT/logs"
          desktop/ci/in-builder.sh desktop/ci/versions.sh | tee "$OUT/logs/versions.log"
          desktop/ci/in-builder.sh cat /usr/share/tur-builder/packages.tsv > "$OUT/logs/builder-packages.tsv"

      - name: Configure and build
        id: build
        run: desktop/ci/in-builder.sh desktop/ci/build.sh ci

      - name: Linked libraries are within the licence boundary
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: python3 desktop/ci/boundary.py --linked desktop/build/ci

      - name: Unit tests and QML tests, headless
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: desktop/ci/in-builder.sh desktop/ci/test.sh ci

      - name: qmllint
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: desktop/ci/in-builder.sh desktop/ci/lint.sh ci

      - name: Toolchain probe (the design's open assumptions)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: desktop/ci/in-builder.sh desktop/ci/probe.sh ci

      - name: Build with sanitizers
        id: sanitize
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: desktop/ci/in-builder.sh desktop/ci/build.sh ci-sanitize

      - name: Tests under sanitizers
        if: ${{ !cancelled() && steps.sanitize.outcome == 'success' }}
        run: desktop/ci/in-builder.sh desktop/ci/test.sh ci-sanitize

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: desktop-build-test
          path: ${{ env.OUT }}
          if-no-files-found: warn

  screenshots:
    name: Screenshots
    needs: builder
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch the builder image
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BUILDER_DIR }}
          key: ${{ needs.builder.outputs.key }}
          fail-on-cache-miss: true

      - name: Load the builder image
        run: desktop/ci/load-builder.sh "$BUILDER_DIR"

      - name: Configure and build
        run: desktop/ci/in-builder.sh desktop/ci/build.sh ci

      - name: Render twice and compare with the references
        run: desktop/ci/in-builder.sh desktop/ci/screenshots.sh ci

      - name: Summary
        if: always()
        run: |
          if [ -f "$OUT/screenshots/report.md" ]; then
            cat "$OUT/screenshots/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Screenshots: nothing was rendered" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: desktop-screenshots
          path: ${{ env.OUT }}/screenshots
          if-no-files-found: warn

  # TUR's desktop programs under a real KWin (desktop-experience.md, 15.3;
  # docs/architecture/tur-pax-overlay.md, section 9): kwin_wayland from the
  # builder image (Fedora 45's, as the TUR image ships it), headless, on its
  # virtual backend, with Mesa's software renderer; tur-settings and
  # tur-pax-overlay as its Wayland clients on a private session bus.
  compositor:
    name: Under KWin
    needs: builder
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fetch the builder image
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BUILDER_DIR }}
          key: ${{ needs.builder.outputs.key }}
          fail-on-cache-miss: true

      - name: Load the builder image
        run: desktop/ci/load-builder.sh "$BUILDER_DIR"

      # KWin 6.8 renders without a GPU through a "software device": Mesa's
      # software renderer, with buffers shared through /dev/udmabuf
      # (src/core/gpumanager.cpp, RenderDevice::createSoftwareDevice). The
      # runner's kernel has the module; the device is given to the runner's
      # user, and to the container and nothing else.
      - name: A render device for KWin's software renderer
        run: |
          uname -r
          [ -e /dev/udmabuf ] || sudo modprobe udmabuf
          ls -l /dev/udmabuf
          sudo chmod 0666 /dev/udmabuf

      - name: Configure and build
        run: desktop/ci/in-builder.sh desktop/ci/build.sh ci

      - name: The tests under KWin
        run: TUR_DEVICE=/dev/udmabuf desktop/ci/in-builder.sh desktop/ci/compositor.sh ci

      - name: Summary
        if: always()
        run: |
          if [ -f "$OUT/compositor/report.md" ]; then
            cat "$OUT/compositor/report.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Under KWin: nothing ran" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: desktop-compositor
          path: ${{ env.OUT }}/compositor
          if-no-files-found: warn

  # P@x's window, tur-pax-ui (task D-17; docs/architecture/tur-pax-ui.md,
  # section 7), against the real P@x session service: `tur-pax serve` on a
  # private session bus, started by the bus, with the real Secret Service
  # (gnome-keyring), the read-only sandbox (bubblewrap) and the scripted
  # provider, exactly as the pax workflow runs it (tests/pax/service_e2e.py,
  # which desktop/tests/pax-ui/e2e.py reuses). First the service's answers
  # are recorded and compared with tur-pax-ui's fixture; then tur-pax-ui,
  # built in the builder image, asks it something, watches its steps and
  # stops a task, from the container, over the bus's socket in the checkout.
  # No model is called and no key exists.
  pax-ui-end-to-end:
    name: P@x's window against the real service
    needs: builder
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install bubblewrap, a message bus and a Secret Service
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap util-linux dbus-daemon gnome-keyring python3-dbus python3-gi
          mkdir -p "$OUT/pax-ui-e2e"
          dpkg-query -W -f '${Package} ${Version}\n' bubblewrap dbus-daemon gnome-keyring python3-dbus | tee "$OUT/pax-ui-e2e/versions.txt"

      - name: Sandbox preflight
        run: tests/pax/sandbox-preflight.sh "$OUT/pax-ui-e2e/sandbox-preflight.txt"

      - name: Toolchain
        working-directory: services/tur-pax
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version; cargo --version

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            services/tur-pax/target
          key: pax-ui-e2e-${{ hashFiles('rust-toolchain.toml', 'services/tur-pax/Cargo.lock') }}
          restore-keys: pax-ui-e2e-

      - name: Build tur-pax
        run: |
          (cd services/tur-pax && cargo build --locked --bin tur-pax)
          ls -l services/tur-pax/target/debug/tur-pax

      - name: The test service's tool program and a runtime directory
        run: |
          sudo install -m 0755 tests/pax/tur-pax-test-tool /usr/bin/tur-pax-test-tool
          uid="$(id -u)"
          sudo mkdir -p "/run/user/$uid"
          sudo chown "$uid" "/run/user/$uid"
          sudo chmod 0700 "/run/user/$uid"

      - name: Record the service's answers and compare them with the fixture
        id: record
        run: |
          python3 desktop/tests/pax-ui/e2e.py record \
            --tur-pax services/tur-pax/target/debug/tur-pax \
            --work-dir "$RUNNER_TEMP/pax-ui-e2e" \
            --evidence "$OUT/pax-ui-e2e"

      - name: Fetch the builder image
        if: ${{ !cancelled() }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ env.BUILDER_DIR }}
          key: ${{ needs.builder.outputs.key }}
          fail-on-cache-miss: true

      - name: Load the builder image
        if: ${{ !cancelled() }}
        run: desktop/ci/load-builder.sh "$BUILDER_DIR"

      - name: Configure and build
        id: build
        if: ${{ !cancelled() }}
        run: desktop/ci/in-builder.sh desktop/ci/build.sh ci

      - name: tur-pax-ui asks the service, sees its steps and stops a task
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 desktop/tests/pax-ui/e2e.py ui \
            --tur-pax services/tur-pax/target/debug/tur-pax \
            --work-dir "$RUNNER_TEMP/pax-ui-e2e" \
            --evidence "$OUT/pax-ui-e2e" \
            --build desktop/build/ci

      - name: Summary
        if: always()
        run: |
          for phase in record ui; do
            if [ -f "$OUT/pax-ui-e2e/$phase-summary.md" ]; then
              cat "$OUT/pax-ui-e2e/$phase-summary.md" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "### P@x's window against the real service: $phase did not run" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: desktop-pax-ui-e2e
          path: ${{ env.OUT }}/pax-ui-e2e
          if-no-files-found: warn
