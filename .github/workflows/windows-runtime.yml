# SPDX-License-Identifier: LicenseRef-TUR-Noncommercial-1.0.0
#
# End-to-end proof that tur-runtime runs a Windows program: real binaries
# built on the runner, the distribution's Wine, and the real bubblewrap
# sandbox. See tests/windows-runtime/e2e.py for what is and is not proved.
#
# A second job installs, starts, uses and removes real applications through
# tur-runtime and publishes a compatibility table. See
# tests/windows-runtime/apps.py and apps.json.
#
# A third job compares prefixes whose drive_c is case-insensitive (ext4
# case folding) with ordinary ones, on a casefold-capable file system made
# in the job. See tests/windows-runtime/casefold.py and compare.py.
#
# A fourth job proves the compatibility autopilot: programs broken on purpose
# (tests/windows-runtime/autopilot/), and real applications with a fault
# injected, each fixed in throwaway copies of its prefix. See
# tests/windows-runtime/autopilot.py and docs/reports/autopilot-1.md.
#
# This runs on Ubuntu with Ubuntu's Wine, not on the TUR image.
name: windows-runtime

on:
  push:
    branches: [main]
    paths:
      - "services/tur-runtime/**"
      - "services/tur-catalogue/**"
      - "schemas/remed*.json"
      - "tests/windows-runtime/**"
      - ".github/workflows/windows-runtime.yml"
  pull_request:
    paths:
      - "services/tur-runtime/**"
      - "services/tur-catalogue/**"
      - "schemas/remed*.json"
      - "tests/windows-runtime/**"
      - ".github/workflows/windows-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  end-to-end:
    name: Run a Windows program under Wine
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Scratch directory
        # Outside the checkout, so that nothing the test writes can be
        # mistaken for source. Later steps read it as $WORK.
        run: |
          mkdir -p "$RUNNER_TEMP/tur-e2e/evidence"
          echo "WORK=$RUNNER_TEMP/tur-e2e" >> "$GITHUB_ENV"

      - name: Install Wine, mingw-w64, bubblewrap and an X server
        # Distribution packages only. Their versions are whatever the runner
        # image's Ubuntu release carries; they are printed by the next step.
        run: |
          sudo apt-get update
          sudo apt-get install -y wine wine64 bubblewrap \
            gcc-mingw-w64-x86-64 gcc-mingw-w64-i686 binutils file xvfb x11-utils

      - name: Versions
        run: |
          mkdir -p "$WORK/evidence"
          {
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            . /etc/os-release; echo "os: $PRETTY_NAME"
            echo "kernel: $(uname -r)"
            echo "wine: $(wine --version 2>/dev/null | head -n 1)"
            echo "bubblewrap: $(bwrap --version)"
            echo "mingw x86_64: $(x86_64-w64-mingw32-gcc --version | head -n 1)"
            echo "mingw i686: $(i686-w64-mingw32-gcc --version | head -n 1)"
            echo "gcc: $(gcc --version | head -n 1)"
            echo "binutils: $(readelf --version | head -n 1)"
            echo "python: $(python3 --version)"
            echo "packages:"
            dpkg-query -W -f '  ${Package} ${Version}\n' wine wine64 libwine bubblewrap \
              gcc-mingw-w64-x86-64-win32 gcc-mingw-w64-i686-win32 mingw-w64-common xvfb 2>&1 || true
            echo "wine programs:"
            ls -l /usr/bin/wine /usr/bin/wine64 /usr/bin/wineserver /usr/bin/wineboot 2>&1 | sed 's/^/  /' || true
            echo "ntsync device: $(ls -l /dev/ntsync 2>&1)"
          } | tee "$WORK/evidence/versions.txt"
          { echo '### Versions'; echo '```'; cat "$WORK/evidence/versions.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Sandbox preflight
        run: |
          tests/windows-runtime/sandbox-preflight.sh "$WORK/evidence/sandbox-preflight.txt"
          { echo '### Sandbox preflight'; echo '```'; cat "$WORK/evidence/sandbox-preflight.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Build the test programs
        run: tests/windows-runtime/build.sh "$WORK/build"

      - name: Toolchain
        working-directory: services/tur-runtime
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version; cargo --version

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            services/tur-runtime/target
          key: windows-runtime-${{ hashFiles('rust-toolchain.toml', 'services/tur-runtime/Cargo.toml', 'services/tur-runtime/Cargo.lock') }}
          restore-keys: windows-runtime-

      - name: Build tur-runtime
        working-directory: services/tur-runtime
        run: cargo build --locked

      - name: End-to-end test
        run: |
          python3 tests/windows-runtime/e2e.py \
            --tur-runtime services/tur-runtime/target/debug/tur-runtime \
            --build-dir "$WORK/build" \
            --work-dir "$WORK/run" \
            --results "$WORK/evidence/results.json"

      - name: Collect logs
        if: always()
        run: |
          mkdir -p "$WORK/evidence"
          cp -r "$WORK/run/xdg-state/tur/runtime/logs" "$WORK/evidence/logs" 2>/dev/null || true
          # What the driver set aside: the control run's output, and the logs
          # and metadata of the application it removed at the end.
          cp -r "$WORK/run/kept" "$WORK/evidence/kept" 2>/dev/null || true
          mkdir -p "$WORK/evidence/metadata"
          for file in "$WORK"/run/xdg-data/tur/runtime/prefixes/*/metadata.json; do
            if [ -f "$file" ]; then
              cp "$file" "$WORK/evidence/metadata/$(basename "$(dirname "$file")").json"
            fi
          done
          cp "$WORK"/run/*.json "$WORK/evidence/" 2>/dev/null || true
          ls -laR "$WORK/evidence" | head -n 200

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-runtime-evidence
          path: ${{ runner.temp }}/tur-e2e/evidence/
          if-no-files-found: warn

  real-applications:
    # Real, freely redistributable Windows applications, installed, started,
    # used once and removed through tur-runtime. The applications, their
    # licences, their publishers' download locations and their pinned
    # hashes are in tests/windows-runtime/apps.json. Nothing downloaded is
    # committed or redistributed.
    #
    # This is Ubuntu's Wine on a hosted runner: not the TUR image (which
    # ships no Wine yet), no GPU, software rendering on an X server without
    # a screen. No Microsoft component, redistributable runtime or
    # winetricks verb is installed.
    name: Install and run real applications under Wine
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Scratch directory
        run: |
          mkdir -p "$RUNNER_TEMP/tur-apps/evidence"
          echo "WORK=$RUNNER_TEMP/tur-apps" >> "$GITHUB_ENV"

      - name: Install Wine with its 32-bit support, bubblewrap and a display
        # Distribution packages only. Most installers are 32-bit programs
        # whatever they install, so Wine's 32-bit half is needed here; the
        # launch-path job above runs without it. OpenSSH's server and
        # PuTTY's key tool are for WinSCP's check: a throwaway SFTP server
        # on the loopback interface, run as the runner's user.
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine64 wine32:i386 bubblewrap unzip \
            xvfb x11-utils openbox wmctrl imagemagick openssh-server openssh-client putty-tools

      - name: Versions
        run: |
          {
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            . /etc/os-release; echo "os: $PRETTY_NAME"
            echo "kernel: $(uname -r)"
            echo "wine: $(wine --version 2>/dev/null | head -n 1)"
            echo "bubblewrap: $(bwrap --version)"
            echo "unzip: $(unzip -v | head -n 1)"
            echo "openssh: $(ssh -V 2>&1)"
            echo "puttygen: $(puttygen --version 2>&1 | head -n 1)"
            echo "python: $(python3 --version)"
            echo "packages:"
            dpkg-query -W -f '  ${Package}:${Architecture} ${Version}\n' wine wine64 wine32 libwine \
              bubblewrap unzip xvfb openbox wmctrl imagemagick openssh-server putty-tools 2>&1 || true
            echo "wine programs:"
            ls -l /usr/bin/wine /usr/bin/wineserver /usr/lib/wine/ 2>&1 | sed 's/^/  /' || true
            echo "ntsync device: $(ls -l /dev/ntsync 2>&1)"
          } | tee "$WORK/evidence/versions.txt"
          { echo '### Versions (real applications)'; echo '```'; cat "$WORK/evidence/versions.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Sandbox preflight
        run: tests/windows-runtime/sandbox-preflight.sh "$WORK/evidence/sandbox-preflight.txt"

      - name: Toolchain
        working-directory: services/tur-runtime
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version; cargo --version

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            services/tur-runtime/target
          key: windows-runtime-${{ hashFiles('rust-toolchain.toml', 'services/tur-runtime/Cargo.toml', 'services/tur-runtime/Cargo.lock') }}
          restore-keys: windows-runtime-

      - name: Build tur-runtime
        working-directory: services/tur-runtime
        run: cargo build --locked

      - name: Install, start, use and remove each application
        # The exit status is 1 when a result differs from the one recorded
        # in apps.json. The table is written either way.
        run: |
          python3 tests/windows-runtime/apps.py \
            --tur-runtime services/tur-runtime/target/debug/tur-runtime \
            --apps tests/windows-runtime/apps.json \
            --work-dir "$WORK/run" \
            --evidence "$WORK/evidence"

      - name: Compatibility table
        if: always()
        run: |
          if [ -f "$WORK/evidence/compatibility.md" ]; then
            cat "$WORK/evidence/compatibility.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No compatibility table was written." >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -laR "$WORK/evidence" | head -n 300

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-runtime-applications
          path: ${{ runner.temp }}/tur-apps/evidence/
          if-no-files-found: warn

  case-folding:
    # Case-insensitive prefixes (issue #81): a prefix's drive_c given the
    # ext4 case-folding attribute before Wine writes into it, compared with
    # an ordinary drive_c, on the same file system. The runner's own disk
    # has no casefold feature, so the job makes a file system that has it,
    # in an image file on a loop device, and runs:
    #   1. tests/windows-runtime/casefold.py: a test program (casefold.c)
    #      that looks at what names in another case resolve to and times
    #      lookups, in both kinds of prefix; and one prefix on the runner's
    #      own disk, which must fall back to case-sensitive and say why;
    #   2. the real applications of the job above, four times: case-folded,
    #      not, not, case-folded, so that neither mode always runs first;
    #   3. tests/windows-runtime/compare.py, which puts the passes side by
    #      side.
    # Same limits as the job above: Ubuntu's Wine on a hosted runner, not
    # the TUR image; no GPU.
    name: Real applications with and without case-insensitive prefixes
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Scratch directory
        run: |
          mkdir -p "$RUNNER_TEMP/tur-casefold/evidence" "$RUNNER_TEMP/tur-casefold/build"
          echo "WORK=$RUNNER_TEMP/tur-casefold" >> "$GITHUB_ENV"

      - name: Install Wine with its 32-bit support, bubblewrap, a display and mingw-w64
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine64 wine32:i386 bubblewrap unzip \
            xvfb x11-utils openbox wmctrl imagemagick gcc-mingw-w64-x86-64 e2fsprogs \
            openssh-server openssh-client putty-tools

      - name: Versions
        run: |
          {
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            . /etc/os-release; echo "os: $PRETTY_NAME"
            echo "kernel: $(uname -r)"
            echo "kernel CONFIG_UNICODE: $(grep -h '^CONFIG_UNICODE' "/boot/config-$(uname -r)" 2>&1 | tr '\n' ' ')"
            echo "kernel ext4 casefold support (/sys/fs/ext4/features/casefold): $(cat /sys/fs/ext4/features/casefold 2>&1)"
            echo "wine: $(wine --version 2>/dev/null | head -n 1)"
            echo "bubblewrap: $(bwrap --version)"
            echo "e2fsprogs: $(mke2fs -V 2>&1 | head -n 1)"
            echo "mingw x86_64: $(x86_64-w64-mingw32-gcc --version | head -n 1)"
            echo "python: $(python3 --version)"
            echo "packages:"
            dpkg-query -W -f '  ${Package}:${Architecture} ${Version}\n' wine wine64 wine32 libwine \
              bubblewrap e2fsprogs unzip xvfb openbox 2>&1 || true
            root="$(findmnt -no SOURCE /)"
            echo "runner's own disk under RUNNER_TEMP: $(findmnt -no SOURCE,FSTYPE -T "$RUNNER_TEMP")"
            echo "features of the runner's root file system ($root):"
            sudo dumpe2fs -h "$root" 2>/dev/null | grep -Ei '^filesystem features|encoding' | sed 's/^/  /' || true
          } | tee "$WORK/evidence/versions.txt"
          { echo '### Versions (case folding)'; echo '```'; cat "$WORK/evidence/versions.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: A file system with the casefold feature
        # An image file on the runner's disk, made with mke2fs's casefold
        # feature (UTF-8, not strict: the defaults) and mounted on a loop
        # device. Nothing on the runner's own file systems is changed.
        run: |
          image="$RUNNER_TEMP/casefold.img"
          truncate -s 24G "$image"
          mkfs.ext4 -q -F -O casefold -E encoding=utf8 -L tur-casefold "$image"
          sudo mkdir -p /srv/tur-casefold
          sudo mount -o loop "$image" /srv/tur-casefold
          sudo chown "$(id -u):$(id -g)" /srv/tur-casefold
          {
            echo "image: $image ($(du -h --apparent-size "$image" | cut -f1) apparent)"
            dumpe2fs -h "$image" 2>/dev/null | grep -Ei '^filesystem features|encoding'
            findmnt /srv/tur-casefold
            mkdir /srv/tur-casefold/probe && chattr +F /srv/tur-casefold/probe && lsattr -d /srv/tur-casefold/probe
            rmdir /srv/tur-casefold/probe
          } | tee "$WORK/evidence/casefold-filesystem.txt"
          echo "CASEFOLD=/srv/tur-casefold" >> "$GITHUB_ENV"

      - name: Sandbox preflight
        run: tests/windows-runtime/sandbox-preflight.sh "$WORK/evidence/sandbox-preflight.txt"

      - name: Toolchain
        working-directory: services/tur-runtime
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version; cargo --version

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            services/tur-runtime/target
          key: windows-runtime-${{ hashFiles('rust-toolchain.toml', 'services/tur-runtime/Cargo.toml', 'services/tur-runtime/Cargo.lock') }}
          restore-keys: windows-runtime-

      - name: Build tur-runtime and the test program
        run: |
          (cd services/tur-runtime && cargo build --locked)
          x86_64-w64-mingw32-gcc -O1 -Wall -Wextra -o "$WORK/build/casefold.exe" tests/windows-runtime/casefold.c

      - name: The test program, with and without case folding
        run: |
          mkdir -p "$WORK/plain"
          python3 tests/windows-runtime/casefold.py \
            --tur-runtime services/tur-runtime/target/debug/tur-runtime \
            --program "$WORK/build/casefold.exe" \
            --casefold-root "$CASEFOLD/program" \
            --plain-root "$WORK/plain" \
            --evidence "$WORK/evidence/program"

      - name: Real applications, case-folded and not, four passes
        if: always()
        run: |
          status=0
          for pass in "1 casefold yes" "2 no-casefold no" "3 no-casefold no" "4 casefold yes"; do
            set -- $pass
            # The previous pass's display is gone before the next starts.
            pkill -x Xvfb || true; pkill -x openbox || true; sleep 2
            rm -f /tmp/.X99-lock /tmp/.X11-unix/X99
            python3 tests/windows-runtime/apps.py \
              --tur-runtime services/tur-runtime/target/debug/tur-runtime \
              --apps tests/windows-runtime/apps.json \
              --work-dir "$CASEFOLD/apps-$1" \
              --downloads "$CASEFOLD/downloads" \
              --evidence "$WORK/evidence/apps-$1-$2" \
              --install-option=--$2 --expect-casefold "$3" \
              --title "Real applications, pass $1: --$2" || status=1
            rm -rf "$CASEFOLD/apps-$1"
          done
          exit $status

      - name: Comparison
        if: always()
        run: |
          python3 tests/windows-runtime/compare.py \
            --pass "casefolded=$WORK/evidence/apps-1-casefold" \
            --pass "not-casefolded=$WORK/evidence/apps-2-no-casefold" \
            --pass "not-casefolded=$WORK/evidence/apps-3-no-casefold" \
            --pass "casefolded=$WORK/evidence/apps-4-casefold" \
            --out "$WORK/evidence" || true
          for file in "$WORK/evidence/casefold-apps.md" "$WORK/evidence/program/casefold.md"; do
            if [ -f "$file" ]; then cat "$file" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done
          cp -r "$WORK/plain/xdg-state/tur/runtime/logs" "$WORK/evidence/plain-logs" 2>/dev/null || true
          cp -r "$CASEFOLD/program/xdg-state/tur/runtime/logs" "$WORK/evidence/program-logs" 2>/dev/null || true
          ls -laR "$WORK/evidence" | head -n 300

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-runtime-casefold
          path: ${{ runner.temp }}/tur-casefold/evidence/
          if-no-files-found: warn

  autopilot:
    # The compatibility autopilot (docs/architecture/compat-autopilot.md):
    #   1. programs broken on purpose, built here from TUR's own sources
    #      (tests/windows-runtime/autopilot/): each must fail in the class
    #      expected, be fixed by the remedy expected in throwaway copies
    #      while its real prefix stays byte for byte the same, give a
    #      compatibility record tur-catalogue accepts and routes, pass after
    #      --apply, and be restored exactly by --revert;
    #   2. two of them again with the data directory on btrfs, to measure
    #      copy-on-write copies;
    #   3. real applications from apps.json: unchanged they must pass; with
    #      one imported DLL disabled for their main program the autopilot
    #      must find the remedy, and after --apply they must pass again.
    # The data directory is on an ext4 file system with the casefold
    # feature, made in the job, so that the case-folding remedy can be
    # tried. Same limits as the jobs above: Ubuntu's Wine on a hosted
    # runner, not the TUR image; no GPU.
    name: Compatibility autopilot
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: "0"
      DEBIAN_FRONTEND: noninteractive
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Scratch directory
        run: |
          mkdir -p "$RUNNER_TEMP/tur-autopilot/evidence" "$RUNNER_TEMP/tur-autopilot/build"
          echo "WORK=$RUNNER_TEMP/tur-autopilot" >> "$GITHUB_ENV"

      - name: Install Wine with its 32-bit support, bubblewrap, a display, mingw-w64 and file-system tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine wine64 wine32:i386 bubblewrap unzip \
            xvfb x11-utils openbox wmctrl imagemagick file \
            gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 e2fsprogs btrfs-progs locales

      - name: A Japanese locale
        # For the code-page remedy: Wine takes the code page from LC_ALL.
        run: sudo locale-gen ja_JP.UTF-8

      - name: Versions
        run: |
          {
            echo "runner image: ${ImageOS:-?} ${ImageVersion:-?}"
            . /etc/os-release; echo "os: $PRETTY_NAME"
            echo "kernel: $(uname -r)"
            echo "wine: $(wine --version 2>/dev/null | head -n 1)"
            echo "bubblewrap: $(bwrap --version)"
            echo "mingw x86_64: $(x86_64-w64-mingw32-gcc --version | head -n 1)"
            echo "e2fsprogs: $(mke2fs -V 2>&1 | head -n 1)"
            echo "btrfs-progs: $(mkfs.btrfs --version 2>&1 | head -n 1)"
            echo "coreutils cp: $(cp --version | head -n 1)"
            echo "xwininfo: $(command -v xwininfo)"
            echo "locales: $(locale -a | grep -i '^ja_JP' | tr '\n' ' ')"
            echo "packages:"
            dpkg-query -W -f '  ${Package}:${Architecture} ${Version}\n' wine wine64 wine32 libwine \
              bubblewrap e2fsprogs btrfs-progs x11-utils xvfb openbox 2>&1 || true
            echo "wine's d3dx9_43 and mfc140u:"
            ls -l /usr/lib/x86_64-linux-gnu/wine/x86_64-windows/d3dx9_43.dll \
              /usr/lib/x86_64-linux-gnu/wine/x86_64-windows/mfc140u.dll 2>&1 | sed 's/^/  /' || true
            echo "ntsync device: $(ls -l /dev/ntsync 2>&1)"
          } | tee "$WORK/evidence/versions.txt"
          { echo '### Versions (autopilot)'; echo '```'; cat "$WORK/evidence/versions.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: File systems for the data directory
        # ext4 with the casefold feature, and btrfs for copy-on-write copies,
        # each in an image file on a loop device. Nothing on the runner's own
        # file systems is changed.
        run: |
          truncate -s 24G "$RUNNER_TEMP/casefold.img"
          mkfs.ext4 -q -F -O casefold -E encoding=utf8 -L tur-casefold "$RUNNER_TEMP/casefold.img"
          sudo mkdir -p /srv/tur-casefold /srv/tur-btrfs
          sudo mount -o loop "$RUNNER_TEMP/casefold.img" /srv/tur-casefold
          sudo chown "$(id -u):$(id -g)" /srv/tur-casefold
          truncate -s 8G "$RUNNER_TEMP/btrfs.img"
          mkfs.btrfs -q -f -L tur-btrfs "$RUNNER_TEMP/btrfs.img"
          sudo mount -o loop "$RUNNER_TEMP/btrfs.img" /srv/tur-btrfs
          sudo chown "$(id -u):$(id -g)" /srv/tur-btrfs
          {
            findmnt /srv/tur-casefold; findmnt /srv/tur-btrfs
            dumpe2fs -h "$RUNNER_TEMP/casefold.img" 2>/dev/null | grep -Ei '^filesystem features|encoding'
          } | tee "$WORK/evidence/file-systems.txt"

      - name: Sandbox preflight
        run: tests/windows-runtime/sandbox-preflight.sh "$WORK/evidence/sandbox-preflight.txt"

      - name: Toolchain
        working-directory: services/tur-runtime
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustc --version; cargo --version

      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            services/tur-runtime/target
            services/tur-catalogue/target
          key: windows-runtime-autopilot-${{ hashFiles('rust-toolchain.toml', 'services/tur-runtime/Cargo.toml', 'services/tur-runtime/Cargo.lock', 'services/tur-catalogue/Cargo.toml', 'services/tur-catalogue/Cargo.lock') }}
          restore-keys: windows-runtime-autopilot-

      - name: Build tur-runtime, tur-catalogue and the broken programs
        run: |
          (cd services/tur-runtime && cargo build --locked)
          (cd services/tur-catalogue && cargo build --locked)
          tests/windows-runtime/autopilot/build.sh "$WORK/build" | tee "$WORK/evidence/build.txt"

      - name: The autopilot, on broken programs and on real applications
        run: |
          python3 tests/windows-runtime/autopilot.py \
            --tur-runtime services/tur-runtime/target/debug/tur-runtime \
            --tur-catalogue services/tur-catalogue/target/debug/tur-catalogue \
            --build-dir "$WORK/build" \
            --work-dir /srv/tur-casefold/autopilot \
            --reflink-work-dir /srv/tur-btrfs/autopilot \
            --apps tests/windows-runtime/apps.json \
            --real 7zip-exe,notepadpp-zip,putty-exe,innosetup,vlc-nsis \
            --downloads "$WORK/downloads" \
            --evidence "$WORK/evidence"

      - name: Table
        if: always()
        run: |
          if [ -f "$WORK/evidence/autopilot.md" ]; then
            cat "$WORK/evidence/autopilot.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No table was written." >> "$GITHUB_STEP_SUMMARY"
          fi
          ls -laR "$WORK/evidence" | head -n 300

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-runtime-autopilot
          path: ${{ runner.temp }}/tur-autopilot/evidence/
          if-no-files-found: warn
