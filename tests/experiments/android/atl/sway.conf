#
# The headless compositor of the Android experiment: one virtual output,
# every window floating at the size it asks for, no decorations of sway's.
output HEADLESS-1 resolution 1280x1100 position 0 0
output * bg #1d2733 solid_color
default_border none
default_floating_border none
for_window [app_id=".*"] floating enable
for_window [title=".*"] floating enable
focus_follows_mouse no
