#
# The headless compositor of the Waydroid jobs: one virtual output; windows
# are tiled, so Waydroid's single window fills it and, in multi-window
# mode, each Android task's window is visible beside the others.
output HEADLESS-1 resolution 1280x800 position 0 0
default_border none
focus_follows_mouse no
